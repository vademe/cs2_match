<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700;900&display=swap" rel="stylesheet">
<title>Турнірна сітка CS2</title>
<style>
:root{
  --bg:#E6EAF0; --panel:#FFFFFF; --panel2:#F2F4F8; --ink:#131A26; --muted:#5A6577; --line:#C6CDD9; --grid:rgba(19,26,38,.055);
  --ct:#2D55A8; --ct-soft:rgba(45,85,168,.13); --t:#A2620C; --t-soft:rgba(162,98,12,.14); --gf-soft:rgba(19,26,38,.08);
  --overlay:rgba(19,26,38,.45);
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111924; --panel:#19222F; --panel2:#1F2A3A; --ink:#E9EDF3; --muted:#8D9AAE; --line:#2D3A4F; --grid:rgba(140,165,200,.06);
    --ct:#82A3E3; --ct-soft:rgba(130,163,227,.15); --t:#EAAB49; --t-soft:rgba(234,171,73,.15); --gf-soft:rgba(233,237,243,.08);
    --overlay:rgba(4,8,14,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111924; --panel:#19222F; --panel2:#1F2A3A; --ink:#E9EDF3; --muted:#8D9AAE; --line:#2D3A4F; --grid:rgba(140,165,200,.06);
  --ct:#82A3E3; --ct-soft:rgba(130,163,227,.15); --t:#EAAB49; --t-soft:rgba(234,171,73,.15); --gf-soft:rgba(233,237,243,.08);
  --overlay:rgba(4,8,14,.65);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:48px 48px;
  font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-size:15px; line-height:1.45;
}
button,input{font:inherit;color:inherit}
.disp{font-family:"Unbounded","Arial Black",system-ui,sans-serif}

/* hero */
.hero{padding:32px 28px 18px; max-width:1900px}
.hero-top{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:18px 32px}
h1{margin:0; font-family:"Unbounded","Arial Black",system-ui,sans-serif; font-weight:900; font-size:clamp(30px,5.4vw,64px); line-height:.98; letter-spacing:-.015em; max-width:16ch}
.sides{display:flex; height:6px; width:min(340px,70%); margin-top:16px; border-radius:3px; overflow:hidden}
.sides i{flex:1}.sides i:first-child{background:var(--ct)}.sides i:last-child{background:var(--t)}
.meta{color:var(--muted); margin:14px 0 0; font-size:14px}
.meta b{color:var(--ink)}
.champ{border:1px solid var(--line); background:var(--panel); border-radius:10px; padding:14px 20px 16px; min-width:240px}
.champ small{display:block; color:var(--muted); font-weight:700; font-size:12.5px}
.champ strong{display:block; font-family:"Unbounded","Arial Black",system-ui,sans-serif; font-size:26px; font-weight:700; line-height:1.15; margin-top:4px}
.champ span{display:block; color:var(--muted); font-size:13px; margin-top:6px}

.bar{display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; padding:0 28px 14px}
.legend{display:flex; gap:14px; font-size:13px; color:var(--muted); font-weight:600}
.legend span{display:inline-flex; align-items:center; gap:7px}
.legend i{width:12px; height:12px; border-radius:2px; display:inline-block}
.hint{font-size:13px; color:var(--muted)}
.spacer{flex:1}
.zoom{display:inline-flex; align-items:center; border:1px solid var(--line); border-radius:8px; background:var(--panel); overflow:hidden}
.zoom button{border:0; background:none; padding:6px 11px; cursor:pointer; font-weight:700; min-width:34px}
.zoom button:hover{background:var(--panel2)}
.zoom output{font-size:12.5px; color:var(--muted); min-width:46px; text-align:center; font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:7px 14px; font-weight:700; font-size:14px; cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink); color:var(--panel); border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.ghost{background:none}
.btn:focus-visible,.zoom button:focus-visible,.pick:focus-visible,input:focus-visible{outline:2px solid var(--ct); outline-offset:2px}
.mode{display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:700; color:var(--ct)}
.mode::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--ct)}

/* bracket */
.stage{overflow:auto; padding:0 0 28px; -webkit-overflow-scrolling:touch}
.sizer{position:relative; margin:0 28px}
.canvas{position:absolute; left:0; top:0; transform-origin:0 0}
.canvas svg{position:absolute; left:0; top:0; overflow:visible}
.edge{fill:none; stroke:var(--line); stroke-width:2}
.edge.lit.ub{stroke:var(--ct)} .edge.lit.lb{stroke:var(--t)} .edge.lit.gf{stroke:var(--ink)}
.sect{position:absolute; font-family:"Unbounded","Arial Black",system-ui,sans-serif; font-weight:700; font-size:21px; white-space:nowrap}
.sect.ub{color:var(--ct)} .sect.lb{color:var(--t)}
.rl{position:absolute; width:232px; font-size:12.5px; font-weight:700; color:var(--muted); white-space:nowrap}
.rl.gf{font-family:"Unbounded","Arial Black",system-ui,sans-serif; font-size:16px; color:var(--ink)}

.m{position:absolute; width:232px; height:92px; background:var(--panel); border:1px solid var(--line); border-radius:7px; overflow:hidden}
.m::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--acc); z-index:1}
.m.ub{--acc:var(--ct); --soft:var(--ct-soft)}
.m.lb{--acc:var(--t); --soft:var(--t-soft)}
.m.gf{--acc:var(--ink); --soft:var(--gf-soft); border-width:2px; border-color:var(--ink)}
.m.gf::before{background:linear-gradient(var(--ct) 0 63%,var(--t) 63% 100%); width:4px}
.mh{height:24px; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:0 10px 0 13px; background:var(--panel2); border-bottom:1px solid var(--line); font-size:11.5px; font-weight:800; color:var(--acc)}
.mh .st{font-weight:600; color:var(--muted); font-size:11px}
.row{height:33px; display:flex; align-items:center; justify-content:space-between; padding-left:13px; font-weight:600; font-size:14.5px; transition:background-color .15s}
.m.gf .row{height:32px}
.row+.row{border-top:1px solid var(--line)}
.row .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding-right:8px}
.row .sc{flex:none; width:40px; height:100%; display:grid; place-items:center; font-family:"Unbounded","Arial Black",system-ui,sans-serif; font-size:13px; font-weight:700; background:var(--panel2); border-left:1px solid var(--line); color:var(--muted); font-variant-numeric:tabular-nums}
.row.win .nm{font-weight:800}
.row.win .sc{background:var(--acc); color:var(--panel); border-left-color:var(--acc)}
.row.lose{color:var(--muted)}
.row.elim .nm{text-decoration:line-through; text-decoration-thickness:1px}
.row.tbd .nm{color:var(--muted); font-weight:500; font-style:italic; font-size:13px}
.row.hl{background:var(--soft)}
.row.hl .nm{color:var(--ink)}
.m.edit{cursor:pointer}
.m.edit:hover{border-color:var(--acc)}
.m.edit:focus-visible{outline:2px solid var(--acc); outline-offset:3px}
.m.fresh{animation:flash 1.2s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 6px var(--soft)}100%{box-shadow:0 0 0 0 transparent}}

/* dialogs */
dialog{border:1px solid var(--line); border-radius:12px; background:var(--panel); color:var(--ink); padding:0; width:min(440px,calc(100vw - 24px)); max-height:calc(100vh - 40px)}
dialog::backdrop{background:var(--overlay)}
.dlg{padding:22px 22px 18px}
.dlg h2{margin:0; font-family:"Unbounded","Arial Black",system-ui,sans-serif; font-size:19px; font-weight:700}
.dlg .sub{margin:4px 0 18px; color:var(--muted); font-size:13.5px}
.lbl{display:block; font-size:13px; font-weight:700; color:var(--muted); margin:0 0 8px}
.picks{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px}
.pick{border:2px solid var(--line); background:var(--panel2); border-radius:10px; padding:14px 10px; font-weight:800; font-size:16px; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pick[aria-pressed="true"]{border-color:var(--ct); background:var(--ct-soft)}
.score{display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center; margin-bottom:8px}
.score input{width:100%; text-align:center; font-family:"Unbounded","Arial Black",system-ui,sans-serif; font-size:24px; font-weight:700; padding:10px 6px; border:1px solid var(--line); border-radius:10px; background:var(--panel2)}
.score span{font-family:"Unbounded","Arial Black",system-ui,sans-serif; font-size:22px; color:var(--muted)}
.score-names{display:grid; grid-template-columns:1fr auto 1fr; gap:10px; font-size:12.5px; color:var(--muted); text-align:center; margin-bottom:14px}
.score-names i{width:14px}
.note{font-size:13px; margin:0 0 14px; padding:9px 12px; border-radius:8px; background:var(--t-soft); color:var(--ink)}
.err{font-size:13px; margin:0 0 14px; color:#C0392B; font-weight:600}
.actions{display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; margin-top:6px}
.actions .left{margin-right:auto}
.plist{display:grid; grid-template-columns:1fr 1fr; gap:8px 10px; margin-bottom:16px}
.field{display:flex; flex-direction:column; gap:4px}
.field span{font-size:12px; color:var(--muted); font-weight:700}
.field input{padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--panel2); font-weight:600}
.field.wide{grid-column:1/-1}

.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--panel); padding:10px 16px; border-radius:10px; font-size:14px; font-weight:600; max-width:calc(100vw - 32px); z-index:50}
.saving{position:fixed; inset:0; background:var(--overlay); display:grid; place-items:center; z-index:40}
.saving div{background:var(--panel); color:var(--ink); padding:16px 22px; border-radius:12px; font-weight:700}
[hidden]{display:none !important}

@media (max-width:640px){
  .hero{padding:24px 16px 14px}
  .bar{padding:0 16px 12px}
  .sizer{margin:0 16px}
  .champ{width:100%}
}
@media (prefers-reduced-motion:reduce){ .m.fresh{animation:none} .row{transition:none} }

.gate{max-width:620px; margin:8vh auto 0; padding:0 20px}
.gate .card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:26px 24px}
.gate h2{margin:0 0 8px; font-family:"Unbounded","Arial Black",system-ui,sans-serif; font-size:22px}
.gate p{margin:0 0 14px; color:var(--muted)}
.gate ol{margin:0 0 16px; padding-left:20px; color:var(--muted)} .gate li{margin-bottom:6px}
.gate a,.foot a{color:var(--ct); font-weight:700}
.gate .field{margin-bottom:12px}
.foot{display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; padding:0 120px 32px 28px; color:var(--muted); font-size:13px}
.foot .btn{font-size:13px; padding:6px 12px}
@media (max-width:640px){ .foot{padding:0 16px 28px} }

/* roster sidebar */
.layout{display:grid; grid-template-columns:232px minmax(0,1fr); align-items:start}
.layout .sizer{margin:0 28px 0 12px}
.roster{position:sticky; top:calc(env(safe-area-inset-top,0px) + 12px); padding:0 0 24px 28px}
.roster-h{margin:0 0 10px; font-family:"Unbounded","Arial Black",system-ui,sans-serif; font-size:16px; font-weight:700}
.roster-list{display:flex; flex-direction:column; gap:4px}
.pl{display:flex; flex-direction:column; align-items:flex-start; gap:1px; width:100%; text-align:left; border:1px solid transparent; border-left:3px solid var(--k,var(--line)); background:transparent; border-radius:8px; padding:7px 10px 8px 11px; cursor:pointer}
.pl:hover{background:var(--panel)}
.pl:focus-visible{outline:2px solid var(--ct); outline-offset:2px}
.pl[aria-pressed="true"]{background:var(--panel); border-color:var(--ink); border-left-color:var(--k,var(--ink))}
.pl-n{font-weight:800; font-size:15px; line-height:1.25}
.pl-s{font-size:12px; color:var(--muted); font-weight:600}
.pl.k-ub{--k:var(--ct)} .pl.k-lb{--k:var(--t)} .pl.k-out{--k:var(--line)} .pl.k-out .pl-n{color:var(--muted)} .pl.k-champ{--k:var(--ink)}
.roster-hint{font-size:12.5px; color:var(--muted); margin:12px 0 0}
.canvas.has-sel .m{opacity:.32; transition:opacity .2s}
.canvas.has-sel .m.sel{opacity:1; box-shadow:0 0 0 2px var(--acc),0 0 0 7px var(--soft)}
.canvas.has-sel .edge{opacity:.3}
.row.mine{background:var(--soft)}
.row.mine .nm{color:var(--ink); font-weight:800}
/* music */
.topline{display:flex; justify-content:flex-end; margin:-8px 0 14px}
.music{display:inline-flex; align-items:center; gap:9px; border:1px solid var(--line); background:var(--panel); border-radius:999px; padding:8px 16px 8px 10px; font-weight:800; font-size:14px; cursor:pointer}
.music:hover{border-color:var(--ink)}
.music:focus-visible{outline:2px solid var(--ct); outline-offset:2px}
.music .ico{width:26px; height:26px; border-radius:50%; display:grid; place-items:center; background:var(--ink); color:var(--panel); font-size:11px}
.music[aria-pressed="true"] .ico{background:var(--ct)}
.eq{display:inline-flex; align-items:flex-end; gap:2px; height:12px}
.eq i{width:3px; background:var(--ct); border-radius:1px; height:4px}
.music[aria-pressed="true"] .eq i{animation:eq 1s ease-in-out infinite}
.music[aria-pressed="true"] .eq i:nth-child(2){animation-delay:-.3s}
.music[aria-pressed="true"] .eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
.splash{position:fixed; inset:0; z-index:60; display:grid; place-items:center; padding:24px; background:var(--overlay); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); cursor:pointer}
.splash-card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:28px 26px 22px; max-width:420px; width:100%; text-align:center; cursor:default}
.splash-card h2{margin:0 0 6px; font-family:"Unbounded","Arial Black",system-ui,sans-serif; font-size:24px; line-height:1.15}
.splash-card p{margin:0 0 20px; color:var(--muted)}
.splash-card .btn.primary{font-size:16px; padding:12px 22px; width:100%}
.splash-card .quiet{margin-top:10px; background:none; border:0; color:var(--muted); font-weight:600; font-size:13.5px; cursor:pointer; text-decoration:underline; text-underline-offset:3px}
/* points */
.pl{display:grid; grid-template-columns:minmax(0,1fr) auto; column-gap:10px; align-items:center}
.pl-n{grid-column:1; grid-row:1}
.pl-s{grid-column:1; grid-row:2}
.pl-pts{grid-column:2; grid-row:1/3; font-family:"Unbounded","Arial Black",system-ui,sans-serif; font-weight:700; font-size:17px; font-variant-numeric:tabular-nums; text-align:right; line-height:1}
.pl-pts small{display:block; font-family:"Manrope",system-ui,sans-serif; font-size:10.5px; font-weight:700; color:var(--muted); margin-top:3px}
.summary{padding:8px 28px 28px; max-width:980px}
.summary h2{margin:0 0 4px; font-family:"Unbounded","Arial Black",system-ui,sans-serif; font-size:21px}
.summary .sub{margin:0 0 14px; color:var(--muted); font-size:13.5px}
.tbl-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:var(--panel)}
.tbl{width:100%; border-collapse:collapse; font-size:14.5px; min-width:620px}
.tbl th{text-align:right; font-size:12.5px; color:var(--muted); font-weight:700; padding:10px 14px; background:var(--panel2); border-bottom:1px solid var(--line); white-space:nowrap}
.tbl td{text-align:right; padding:10px 14px; border-top:1px solid var(--line); font-variant-numeric:tabular-nums; white-space:nowrap}
.tbl tr:first-child td{border-top:0}
.tbl th:nth-child(2),.tbl td:nth-child(2),.tbl th:last-child,.tbl td:last-child{text-align:left}
.tbl td:nth-child(2){font-weight:800}
.tbl td.pts{font-family:"Unbounded","Arial Black",system-ui,sans-serif; font-weight:700}
.tbl td.rank{color:var(--muted); font-weight:700; width:40px}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--panel2)}
.tbl tbody tr.on{background:var(--ct-soft)}
.tbl .st{color:var(--muted); font-weight:600; font-size:13px}
.tbl .neg{color:var(--muted)}
@media (max-width:640px){ .summary{padding:8px 16px 24px} .topline{margin:-4px 0 12px} }
@media (prefers-reduced-motion:reduce){ .music[aria-pressed="true"] .eq i{animation:none; height:8px} }
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .roster{position:static; padding:0 16px 12px}
  .roster-list{flex-direction:row; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch}
  .pl{width:auto; flex:none; border:1px solid var(--line); border-left:3px solid var(--k,var(--line))}
  .layout .sizer{margin:0 16px}
  .roster-hint{margin-top:6px}
}
@media (prefers-reduced-motion:reduce){ .canvas.has-sel .m{transition:none} }

/* ---------- map veto ---------- */
.mh .mi{display:inline-flex; gap:3px; align-items:center}
.mh .mi img,.mh .mi i{width:18px; height:18px; display:block; object-fit:contain}
.mh .mi i{border-radius:50%; border:1px dashed var(--line)}
.mh .st.vt{color:var(--acc)}
.m.has-veto .mh{cursor:pointer}
.vblock{border:1px solid var(--line); border-radius:10px; padding:12px 14px 14px; margin:0 0 18px; background:var(--panel2)}
.vb-t{margin:0 0 12px; font-size:13.5px; color:var(--muted)}
.vb-maps{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px}
.vb-m{display:flex; flex-direction:column; align-items:center; gap:2px; text-align:center; font-weight:700; font-size:13px}
.vb-m small{color:var(--muted); font-weight:600; font-size:11.5px}
.vb-i{width:44px; height:44px; object-fit:contain}
.vb-q{width:44px; height:44px; border-radius:50%; border:2px dashed var(--line); display:grid; place-items:center; color:var(--muted); font-weight:800}
.vb-act{display:flex; flex-wrap:wrap; gap:8px}
#vb-reset.confirm{border-color:#C0392B; color:#C0392B}

dialog.vdlg{width:min(1040px,calc(100vw - 24px)); max-height:calc(100dvh - 24px); padding:0; overflow:auto}
.vwrap{padding:22px 24px 20px}
.vhead{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:18px}
.vhead h2{margin:0; font-family:"Unbounded","Arial Black",system-ui,sans-serif; font-size:22px; font-weight:700}
.vsub{display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; margin:8px 0 0; font-weight:800; font-size:15px}
.vs-p{display:inline-flex; align-items:center; gap:7px}
.vs-p.ct{color:var(--ct)} .vs-p.t{color:var(--t)}
.vs-i{width:24px; height:24px}
.vs-x{color:var(--muted); font-weight:600; font-size:13px}
.vs-bo{font-size:11.5px; font-weight:800; color:var(--muted); border:1px solid var(--line); border-radius:6px; padding:2px 7px}
.vx{border:1px solid var(--line); background:var(--panel2); width:36px; height:36px; border-radius:50%; cursor:pointer; font-size:14px; flex:none}
.vx:hover{border-color:var(--ink)}

/* roulette */
.roll{text-align:center}
.roll-t{margin:0 0 14px; color:var(--muted); font-weight:700}
.rl-win{position:relative; overflow:hidden; height:190px; border:1px solid var(--line); border-radius:12px; background:var(--panel2);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent); mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.rl-strip{position:absolute; left:0; top:17px; display:flex; gap:10px; will-change:transform}
.rc{flex:none; width:156px; height:156px; border-radius:12px; background:var(--panel); border:1px solid var(--line); border-bottom:4px solid var(--c);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; font-weight:800; font-size:15px; padding:8px}
.rc span{max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rc.ct{--c:var(--ct)} .rc.t{--c:var(--t)}
.rc-i{width:78px; height:78px}
.rc.won{box-shadow:0 0 0 3px var(--c),0 0 28px var(--c); transform:scale(1.04); transition:transform .3s, box-shadow .3s}

<div id="root"></div>
<script>
(function(){
'use strict';

/* ---------- settings ---------- */
var API='https://api.github.com';
var FILE='cs2-bracket.json';
var TOKEN_KEY='cs2-bracket-token';
var POLL_MS=90000;
var DEFAULT_STATE={title:'Турнірна сітка CS2',players:['Вова','Вадим','Матвей','Гена','Леха','Никита','Олег','Кубик','Вася','Паша'],results:{},vetos:{},updatedAt:null};

/* ---------- bracket structure ---------- */
var BW=232, BH=92, CX=268, U=96, L=764;
function X(c){return c*CX;}
var MATCHES=[
  {id:'M1',  code:'M1',          round:'Перший раунд, матч 1', sect:'ub', c:0, y:U,      a:{p:0}, b:{p:1}},
  {id:'M2',  code:'M2',          round:'Перший раунд, матч 2', sect:'ub', c:0, y:U+300,  a:{p:2}, b:{p:3}},
  {id:'QF1', code:'UB-QF1',      round:'Чвертьфінал 1',        sect:'ub', c:1, y:U,      a:{p:4}, b:{w:'M1'}},
  {id:'QF4', code:'UB-QF4',      round:'Чвертьфінал 4',        sect:'ub', c:1, y:U+150,  a:{p:8}, b:{p:9}},
  {id:'QF2', code:'UB-QF2',      round:'Чвертьфінал 2',        sect:'ub', c:1, y:U+300,  a:{p:5}, b:{w:'M2'}},
  {id:'QF3', code:'UB-QF3',      round:'Чвертьфінал 3',        sect:'ub', c:1, y:U+450,  a:{p:6}, b:{p:7}},

  {id:'SF2', code:'UB-SF2',      round:'Півфінал верхньої сітки 2', sect:'ub', c:2, y:U+375, a:{w:'QF2'}, b:{w:'QF3'}},
  {id:'UBF', code:'UB-Final',    round:'Фінал верхньої сітки', sect:'ub', c:3, y:U+225,  a:{w:'SF1'}, b:{w:'SF2'}},
  {id:'M3',  code:'M3 (LB-R1)',  round:'Нижня сітка, раунд 1', sect:'lb', c:0, y:L,      a:{l:'M1'}, b:{l:'M2'}},
  {id:'R21', code:'LB-R2.1',     round:'Нижня сітка, раунд 2', sect:'lb', c:1, y:L,      a:{w:'M3'}, b:{l:'QF1'}},
  {id:'R22', code:'LB-R2.2',     round:'Нижня сітка, раунд 2', sect:'lb', c:1, y:L+150,  a:{l:'QF2'}, b:{l:'QF3'}},
  {id:'R31', code:'LB-R3.1',     round:'Нижня сітка, раунд 3', sect:'lb', c:2, y:L+75,   a:{w:'R21'}, b:{w:'R22'}},
  {id:'R32', code:'LB-R3.2',     round:'Нижня сітка, раунд 3', sect:'lb', c:2, y:L+262,  a:{l:'QF4'}, b:{l:'SF1'}},
  {id:'R4',  code:'LB-R4',       round:'Нижня сітка, раунд 4', sect:'lb', c:3, y:L+75,   a:{w:'R31'}, b:{l:'SF2'}},
  {id:'R5',  code:'LB-SF',       round:'Півфінал нижньої сітки', sect:'lb', c:4, y:L+168, a:{w:'R4'}, b:{w:'R32'}},
  {id:'LBF', code:'LB-Final',    round:'Фінал нижньої сітки',  sect:'lb', c:5, y:L+168,  a:{w:'R5'}, b:{l:'UBF'}},
  {id:'GF',  code:'Grand Final', round:'Гранд-фінал',          sect:'gf', c:6, y:0,      a:{w:'UBF'}, b:{w:'LBF'}}
];
var BYID={}; MATCHES.forEach(function(m){BYID[m.id]=m;});
(function(){ var u=BYID.UBF.y+BH/2, l=BYID.LBF.y+BH/2; BYID.GF.y=Math.round((u+l)/2-BH/2); })();
var CANVAS_W=X(6)+BW, CANVAS_H=L+262+BH+8;
var LABELS=[
  {cls:'sect ub', x:0, y:14, t:'Верхня сітка'},
  {cls:'rl', x:X(0), y:U-26, t:'Перший раунд'},
  {cls:'rl', x:X(1), y:U-26, t:'Чвертьфінали'},
  {cls:'rl', x:X(2), y:U-26, t:'Півфінали'},
  {cls:'rl', x:X(3), y:U-26, t:'Фінал верхньої сітки'},
  {cls:'sect lb', x:0, y:L-84, t:'Нижня сітка'},
  {cls:'rl', x:X(0), y:L-26, t:'Раунд 1'},
  {cls:'rl', x:X(1), y:L-26, t:'Раунд 2'},
  {cls:'rl', x:X(2), y:L-26, t:'Раунд 3'},
  {cls:'rl', x:X(3), y:L-26, t:'Раунд 4'},
  {cls:'rl', x:X(4), y:L-26, t:'Півфінал нижньої'},
  {cls:'rl', x:X(5), y:L-26, t:'Фінал нижньої сітки'},
  {cls:'rl gf', x:X(6), y:BYID.GF.y-32, t:'Гранд-фінал'}
];

/* ---------- state ---------- */
var selP=null, state=null, gistId=null, ownerLogin=null, token=null, editable=false, zoom=1, fresh=null, busy=false;
try{ gistId=new URLSearchParams(location.search).get('id'); }catch(e){}
if(gistId && !/^[0-9a-f]{20,40}$/i.test(gistId)) gistId=null;
try{ token=localStorage.getItem(TOKEN_KEY); }catch(e){}

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function clone(o){return JSON.parse(JSON.stringify(o));}
function normalize(s){
  var d=clone(DEFAULT_STATE);
  if(s && typeof s==='object'){
    if(typeof s.title==='string') d.title=s.title;
    if(Array.isArray(s.players) && s.players.length===10) d.players=s.players.map(String);
    if(s.results && typeof s.results==='object') d.results=s.results;
    if(s.vetos && typeof s.vetos==='object') d.vetos=s.vetos;
    if(s.updatedAt) d.updatedAt=s.updatedAt;
  }
  return d;
}
function compute(st){
  var R={}, P={};
  function src(s){
    if(s.p!=null) return s.p;
    var r=R[s.w||s.l]; if(!r) return null;

    return s.w ? ids[r.w] : ids[1-r.w];
  }
  MATCHES.forEach(function(m){
    var pa=src(m.a), pb=src(m.b);
    P[m.id]=[pa,pb];
    var r=st.results[m.id];
    if(r && pa!=null && pb!=null && r.pa===pa && r.pb===pb && (r.w===0||r.w===1)) R[m.id]=r;
  });
  return {R:R,P:P};
}
function prune(st){
  var c=compute(st), v={};
  st.results=c.R;
  Object.keys(st.vetos||{}).forEach(function(k){ var x=st.vetos[k], pp=c.P[k]; if(x&&pp&&x.pa===pp[0]&&x.pb===pp[1]) v[k]=x; });
  st.vetos=v;
  return st;
}
function placeholder(s){
  if(s.w) return 'Переможець '+BYID[s.w].code;
  if(s.l) return 'Програв у '+BYID[s.l].code;
  return '';
}

/* ---------- page shell ---------- */
var root=document.getElementById('root');
root.innerHTML=
 '<section class="gate" id="gate"><div class="card" id="gate-card"><p>Завантажую сітку…</p></div></section>'+
 '<div id="main" hidden>'+
 '<header class="hero"><div class="topline"><button type="button" class="music" id="music-btn" aria-pressed="false"><span class="ico" id="music-ico">▶</span><span id="music-txt">Увімкнути музику</span><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span></button></div><div class="hero-top"><div><h1 id="title"></h1><div class="sides" aria-hidden="true"><i></i><i></i></div><p class="meta" id="meta"></p></div><div id="champ"></div></div></header>'+
 '<div class="bar"><div class="legend"><span><i style="background:var(--ct)"></i>Верхня сітка</span><span><i style="background:var(--t)"></i>Нижня сітка</span></div>'+
 '<span class="hint" id="hint"></span><span class="spacer"></span><span id="tools"></span>'+
  '<div class="zoom" role="group" aria-label="Масштаб"><button type="button" id="zout" aria-label="Зменшити">−</button><output id="zval">100%</output><button type="button" id="zin" aria-label="Збільшити">+</button><button type="button" id="zfit">Уся сітка</button></div></div>'+
 '<div class="layout"><aside class="roster" aria-labelledby="roster-h"><h2 class="roster-h" id="roster-h">Учасники</h2><div class="roster-list" id="roster"></div><p class="roster-hint" id="roster-hint">Оберіть гравця, щоб підсвітити його матчі.</p></aside>'+
 '<div class="stage" id="stage"><div class="sizer" id="sizer"><div class="canvas" id="canvas"></div></div></div></div>'+
 '<section class="summary" aria-labelledby="sum-h"><h2 id="sum-h">Підсумок</h2><p class="sub">Набрані бали рахуються з усіх матчів, де вказано рахунок.</p><div class="tbl-wrap" id="sum"></div></section>'+
 '<footer class="foot"><button type="button" class="btn" id="copy-link">Скопіювати посилання</button><span class="spacer"></span><span id="who"></span><button type="button" class="btn ghost" id="auth-btn"></button></footer>'+
 '<button type="button" class="case-fab" id="case-fab" title="Відкрити кейс"></button>'+
 '</div>'+

function $(id){return document.getElementById(id);}
var toastT;
function toast(msg){ var t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(function(){t.hidden=true;},4200); }
function showGate(html){ $('gate-card').innerHTML=html; $('gate').hidden=false; $('main').hidden=true; }
function showMain(){ $('gate').hidden=true; $('main').hidden=false; }

/* ---------- render ---------- */
function render(){
  if(!state) return;
  showMain();
  var cmp=compute(state), R=cmp.R, P=cmp.P, pl=state.players;
  $('title').textContent=state.title||'Турнірна сітка CS2';
  document.title=state.title||'Турнірна сітка CS2';
  var played=Object.keys(R).length;
  var meta='Подвійне вибування, '+pl.length+' гравців. Зіграно <b>'+played+'</b> з '+MATCHES.length+' матчів.';
  if(state.updatedAt){
    try{ meta+=' Оновлено '+esc(new Date(state.updatedAt).toLocaleString('uk-UA',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}))+'.'; }catch(e){}
  }
  $('meta').innerHTML=meta;

  var gf=R.GF, ch=$('champ');
  if(gf){
    var ids=[gf.pa,gf.pb];
    ch.innerHTML='<div class="champ"><small>Переможець турніру</small><strong>🏆 '+esc(pl[ids[gf.w]])+'</strong><span>Друге місце: '+esc(pl[ids[1-gf.w]])+(gf.s?', рахунок фіналу '+esc(gf.s[gf.w])+':'+esc(gf.s[1-gf.w]):'')+'</span></div>';
  } else ch.innerHTML='';

  $('hint').textContent=editable
    ? 'Натисніть на матч, щоб вказати переможця і рахунок.'
    : 'Оберіть гравця в списку учасників або в сітці, щоб підсвітити його матчі.';
  $('tools').innerHTML=editable ? '<span class="mode">Ви редагуєте</span> <button type="button" class="btn" id="open-players" style="margin-left:10px">Учасники</button>' : '';
  if(editable) $('open-players').onclick=openPlayers;
  $('auth-btn').textContent=editable?'Вийти':'Я організатор';
  $('who').textContent=editable&&ownerLogin?'Організатор: '+ownerLogin:'';

  var paths='';
  MATCHES.forEach(function(m){
    [m.a,m.b].forEach(function(s,side){
      if(!s.w) return;
      var f=BYID[s.w];
      var x1=X(f.c)+BW, y1=f.y+24+33, x2=X(m.c), y2=m.y+24+16.5+side*33;
      if(m.sect==='gf'){ y2=m.y+26+16+side*32; }
      var mx=x2-20, lit=R[s.w]?' lit':'';
      paths+='<path class="edge '+m.sect+lit+'" d="M'+x1+' '+y1+'H'+mx+'V'+y2+'H'+x2+'"/>';
    });
  });
  var html='<svg width="'+CANVAS_W+'" height="'+CANVAS_H+'" aria-hidden="true">'+paths+'</svg>';
  LABELS.forEach(function(l){ html+='<div class="'+l.cls+'" style="left:'+l.x+'px;top:'+l.y+'px">'+esc(l.t)+'</div>'; });

  MATCHES.forEach(function(m){
    var pp=P[m.id], r=R[m.id], ready=pp[0]!=null&&pp[1]!=null;
    var st=r?'Зіграно':(ready?'Очікує гри':'');
    var rows='';
    [m.a,m.b].forEach(function(s,side){
      var p=pp[side], cls='row', name, sc='', dp='', tip='';
      if(p==null){ cls+=' tbd'; name=esc(placeholder(s)); }
      else{
        name=esc(pl[p]); dp=' data-p="'+p+'"';
        if(s.l) tip=' title="'+esc(pl[p]+' прийшов із '+BYID[s.l].code)+'"';
        if(r){
          if(r.w===side) cls+=' win';
          else cls+=' lose'+(m.sect==='lb'?' elim':'');
          if(r.s && r.s[side]!=null) sc=esc(r.s[side]);
        }
      }
      if(p!=null && selP!=null && String(p)===selP) cls+=' mine';
      rows+='<div class="'+cls+'"'+dp+tip+'><span class="nm">'+name+'</span><span class="sc">'+sc+'</span></div>';
    });
    var vv=state.vetos&&state.vetos[m.id], right='<span class="st">'+st+'</span>';
    if(!vetoValid(vv,pp)) vv=null;
    if(vv){
      var vm=vetoMaps(vv);
      right=vm.some(function(x){return x;})
        ? '<span class="mi" title="Переглянути вибір карт">'+vm.map(function(x,i){ return x?'<img src="'+ICON[x]+'" alt="'+esc(MAPBY[x].name)+'" title="'+esc(SLOTS[i].t+': '+MAPBY[x].name+', '+SLOTS[i].w)+'">':'<i></i>'; }).join('')+'</span>'
        : '<span class="st vt">Вибір карт…</span>';
    }
    var mine=selP!=null&&(String(pp[0])===selP||String(pp[1])===selP);
    var attrs=editable?' tabindex="0" role="button" aria-label="'+esc(m.code+', змінити результат')+'"':'';
    html+='<div class="m '+m.sect+(editable?' edit':'')+(fresh===m.id?' fresh':'')+(mine?' sel':'')+(vv?' has-veto':'')+'" data-id="'+m.id+'" style="left:'+X(m.c)+'px;top:'+m.y+'px"'+attrs+'>'+
      '<div class="mh"><span>'+esc(m.code)+'</span>'+right+'</div>'+rows+'</div>';
  });
  var cv=$('canvas'); cv.innerHTML=html; cv.classList.toggle('has-sel',selP!=null);
  hlP=null; fresh=null;
  renderRoster(R);
  applyZoom();
}

/* ---------- roster ---------- */
function playerInfo(R,i){
  var w=0,l=0,status='Верхня сітка',kind='ub',pf=0,pa=0;
  MATCHES.forEach(function(m){
    var r=R[m.id]; if(!r) return;
    var ids=[r.pa,r.pb], side=ids.indexOf(i); if(side<0) return;
    if(r.s){ pf+=r.s[side]||0; pa+=r.s[1-side]||0; }
    if(r.w===side) w++; else{
      l++;
      if(m.sect==='ub'){ status='Нижня сітка'; kind='lb'; }
      else if(m.id==='GF'){ status='2 місце'; kind='out'; }
      else if(m.id==='LBF'){ status='3 місце'; kind='out'; }
      else { status='Вибув'; kind='out'; }
    }
    if(m.id==='GF' && r.w===side){ status='Чемпіон'; kind='champ'; }
  });
  return {w:w,l:l,status:status,kind:kind,pf:pf,pa:pa};
}
function renderRoster(R){
  var pl=state.players, order=pl.map(function(_,i){return i;});
  var h='';
  order.forEach(function(i){
    var inf=playerInfo(R,i), on=selP===String(i);
    h+='<button type="button" class="pl k-'+inf.kind+'" data-p="'+i+'" aria-pressed="'+on+'">'+
      '<span class="pl-n">'+(inf.kind==='champ'?'🏆 ':'')+esc(pl[i])+'</span>'+
      '<span class="pl-s">'+esc(inf.status)+', '+inf.w+'–'+inf.l+'</span>'+
      '<span class="pl-pts" title="Набрано балів">'+inf.pf+'<small>'+plural(inf.pf,'бал','бали','балів')+'</small></span></button>';
  });
  $('roster').innerHTML=h;
  renderSummary(R);
  $('roster-hint').textContent=selP!=null?'Натисніть ще раз або Esc, щоб зняти виділення.':'Оберіть гравця, щоб підсвітити його матчі.';
}
function renderSummary(R){
  var pl=state.players, rows=pl.map(function(n,i){ var inf=playerInfo(R,i); inf.i=i; inf.n=n; return inf; });
  rows.sort(function(a,b){ return (b.pf-a.pf)||((b.pf-b.pa)-(a.pf-a.pa))||(b.w-a.w)||(a.l-b.l)||(a.i-b.i); });
  var h='<table class="tbl"><thead><tr><th>#</th><th>Гравець</th><th>Матчі</th><th>Перемоги–поразки</th><th>Набрано</th><th>Пропущено</th><th>Різниця</th><th>Статус</th></tr></thead><tbody>';
  rows.forEach(function(r,k){
    var d=r.pf-r.pa;
    h+='<tr data-p="'+r.i+'"'+(selP===String(r.i)?' class="on"':'')+'><td class="rank">'+(k+1)+'</td><td>'+(r.kind==='champ'?'🏆 ':'')+esc(r.n)+'</td><td>'+(r.w+r.l)+'</td><td>'+r.w+'–'+r.l+'</td><td class="pts">'+r.pf+'</td><td>'+r.pa+'</td><td'+(d<0?' class="neg"':'')+'>'+(d>0?'+':d<0?'−':'')+Math.abs(d)+'</td><td class="st">'+esc(r.status)+'</td></tr>';
  });
  $('sum').innerHTML=h+'</tbody></table>';
}
function selectPlayer(p,scroll){
  selP=(p==null||selP===p)?null:p;
  render();
  if(scroll && selP!=null){
    var boxes=$('canvas').querySelectorAll('.m.sel');
    var last=boxes[boxes.length-1]||boxes[0];
    var sr=$('stage').getBoundingClientRect(), lr=last&&last.getBoundingClientRect();
    var visible=lr && lr.left>=sr.left && lr.right<=sr.right && lr.top>=0 && lr.bottom<=window.innerHeight;
    if(last && !visible && last.scrollIntoView){ try{ last.scrollIntoView({block:'nearest',inline:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}); }catch(e){} }
  }
}
$('sum').addEventListener('click',function(e){ var tr=e.target.closest('tr[data-p]'); if(tr){ selectPlayer(tr.getAttribute('data-p'),false); var st=$('stage'); if(st.scrollIntoView) st.scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}); } });
$('roster').addEventListener('click',function(e){ var b=e.target.closest('.pl'); if(b) selectPlayer(b.getAttribute('data-p'),true); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape' && selP!=null && !document.querySelector('dialog[open]')) selectPlayer(null); });

/* ---------- zoom ---------- */
function applyZoom(){
  var c=$('canvas');
  c.style.width=CANVAS_W+'px'; c.style.height=CANVAS_H+'px';
  c.style.transform='scale('+zoom+')';
  $('sizer').style.width=Math.ceil(CANVAS_W*zoom)+'px';
  $('sizer').style.height=Math.ceil(CANVAS_H*zoom)+'px';
  $('zval').textContent=Math.round(zoom*100)+'%';
}
function setZoom(z){ zoom=Math.max(.3,Math.min(1.4,Math.round(z*100)/100)); applyZoom(); try{localStorage.setItem('bracket-zoom',String(zoom));}catch(e){} }
function fitZoom(){ var w=(document.documentElement.clientWidth||window.innerWidth)-(window.innerWidth<=640?32:56); return Math.min(1,w/CANVAS_W); }
$('zin').onclick=function(){setZoom(zoom+.1);};
$('zout').onclick=function(){setZoom(zoom-.1);};
$('zfit').onclick=function(){setZoom(fitZoom());};
(function(){
  var saved=null; try{saved=parseFloat(localStorage.getItem('bracket-zoom'));}catch(e){}
  if(saved && isFinite(saved)) zoom=Math.max(.3,Math.min(1.4,saved));
  else zoom=window.innerWidth<900 ? Math.max(.55,fitZoom()) : 1;
})();

/* ---------- highlight a player's path ---------- */
var hlP=null;
function highlight(p){
  if(p===hlP) return; hlP=p;
  var rows=$('canvas').querySelectorAll('.row[data-p]');
  for(var i=0;i<rows.length;i++) rows[i].classList.toggle('hl', p!=null && rows[i].getAttribute('data-p')===p);
}
$('canvas').addEventListener('mouseover',function(e){ var r=e.target.closest('.row[data-p]'); highlight(r?r.getAttribute('data-p'):null); });
$('canvas').addEventListener('mouseleave',function(){ highlight(null); });
$('canvas').addEventListener('click',function(e){
  var box=e.target.closest('.m');
  if(editable && box){ openMatch(box.getAttribute('data-id')); return; }
  var r=e.target.closest('.row[data-p]');
  if(r){ selectPlayer(r.getAttribute('data-p'),false); return; }
  if(box && box.classList.contains('has-veto')) openVeto(box.getAttribute('data-id'),false);
});
$('canvas').addEventListener('keydown',function(e){
  if(!editable) return;
  if(e.key==='Enter'||e.key===' '){ var box=e.target.closest('.m'); if(box){ e.preventDefault(); openMatch(box.getAttribute('data-id')); } }
});

/* ---------- match dialog ---------- */
var cur=null, sel=null;
function openMatch(id){
  var m=BYID[id], cmp=compute(state), pp=cmp.P[id];
  if(pp[0]==null||pp[1]==null){ toast('Учасники цього матчу ще не визначені.'); return; }
  cur={m:m,pp:pp};
  var r=cmp.R[id];
  sel=r?r.w:null;
  $('dm-h').textContent=m.code;
  $('dm-sub').textContent=m.round+': '+state.players[pp[0]]+' проти '+state.players[pp[1]];
  $('pk0').textContent=state.players[pp[0]]; $('pk1').textContent=state.players[pp[1]];
  $('sn0').textContent=state.players[pp[0]]; $('sn1').textContent=state.players[pp[1]];
  $('s0').value=r&&r.s&&r.s[0]!=null?r.s[0]:''; $('s1').value=r&&r.s&&r.s[1]!=null?r.s[1]:'';
  $('dm-reset').hidden=!r;
  $('dm-err').hidden=true;
  syncPicks();
  renderMatchVeto();
  $('dm').showModal();
}
function syncPicks(){
  $('pk0').setAttribute('aria-pressed',String(sel===0));
  $('pk1').setAttribute('aria-pressed',String(sel===1));
  var note=$('dm-note');
  if(sel==null){ note.hidden=true; return; }
  var before=compute(state).R, trial=clone(state);
  trial.results[cur.m.id]={pa:cur.pp[0],pb:cur.pp[1],w:sel,s:null};
  var after=prune(trial).results, lost=0;
  Object.keys(before).forEach(function(k){ if(k!==cur.m.id && !after[k]) lost++; });
  if(lost){ note.textContent='Зміна переможця скине '+lost+' '+plural(lost,'пізніший результат','пізніші результати','пізніших результатів')+', бо в тих матчах змінюються учасники.'; note.hidden=false; }
  else note.hidden=true;
}
function plural(n,a,b,c){ var m10=n%10,m100=n%100; if(m10===1&&m100!==11) return a; if(m10>=2&&m10<=4&&(m100<12||m100>14)) return b; return c; }
function readScore(el){ var v=el.value.trim(); if(v==='') return null; var n=parseInt(v,10); return isFinite(n)&&n>=0&&n<=99?n:NaN; }
$('pk0').onclick=function(){sel=0;syncPicks();$('dm-err').hidden=true;};
$('pk1').onclick=function(){sel=1;syncPicks();$('dm-err').hidden=true;};
function autoPick(){ var a=readScore($('s0')), b=readScore($('s1')); if(a!=null&&b!=null&&!isNaN(a)&&!isNaN(b)&&a!==b){ sel=a>b?0:1; syncPicks(); } }
$('s0').oninput=autoPick; $('s1').oninput=autoPick;
$('dm-cancel').onclick=function(){ $('dm').close(); };
$('dm-save').onclick=function(){
  var err=$('dm-err'), a=readScore($('s0')), b=readScore($('s1'));
  function fail(t){ err.textContent=t; err.hidden=false; }
  if(sel==null) return fail('Оберіть переможця.');
  if(isNaN(a)||isNaN(b)) return fail('Рахунок має бути числом від 0 до 99.');
  if((a==null)!==(b==null)) return fail('Вкажіть рахунок для обох гравців або залиште обидва поля порожніми.');
  if(a!=null){
    if(a===b) return fail('Рахунок не може бути нічийним.');
    if((sel===0&&a<b)||(sel===1&&b<a)) return fail('Рахунок не збігається з обраним переможцем.');
  }
  var next=clone(state);
  next.results[cur.m.id]={pa:cur.pp[0],pb:cur.pp[1],w:sel,s:a==null?null:[a,b]};
  prune(next);
  save(next,cur.m.id);
};
$('dm-reset').onclick=function(){
  var next=clone(state);
  delete next.results[cur.m.id];
  prune(next);
  save(next,cur.m.id);
};

function openPlayers(){
  var h='<label class="field wide"><span>Назва турніру</span><input id="pt" maxlength="60"></label>';
  state.players.forEach(function(p,i){ h+='<label class="field"><span>Гравець '+(i+1)+'</span><input data-i="'+i+'" maxlength="24"></label>'; });
  $('plist').innerHTML=h;
  $('pt').value=state.title||'';
  var ins=$('plist').querySelectorAll('input[data-i]');
  for(var i=0;i<ins.length;i++) ins[i].value=state.players[+ins[i].getAttribute('data-i')];
  $('dp-err').hidden=true;
  $('dp').showModal();
}
$('dp-cancel').onclick=function(){ $('dp').close(); };
$('dp-save').onclick=function(){
  var next=clone(state), ins=$('plist').querySelectorAll('input[data-i]'), seen={};
  for(var i=0;i<ins.length;i++){
    var v=ins[i].value.trim();
    if(!v){ $('dp-err').textContent='Ім’я гравця не може бути порожнім.'; $('dp-err').hidden=false; return; }
    if(seen[v.toLowerCase()]){ $('dp-err').textContent='Імена мають бути різними: «'+v+'» повторюється.'; $('dp-err').hidden=false; return; }
    seen[v.toLowerCase()]=1;
    next.players[+ins[i].getAttribute('data-i')]=v;
  }
  next.title=$('pt').value.trim()||'Турнірна сітка CS2';
  save(next,null);
};

/* ---------- GitHub storage ---------- */
function gh(path,opts){
  opts=opts||{};
  var h={'Accept':'application/vnd.github+json'};
  if(opts.token){ h['Authorization']='Bearer '+opts.token; }
  if(opts.body){ h['Content-Type']='application/json'; }
  return fetch(API+path,{method:opts.method||'GET',headers:h,body:opts.body?JSON.stringify(opts.body):undefined,cache:opts.token?'no-store':'default'});
}
function fileBody(st){ var f={}; f[FILE]={content:JSON.stringify(st,null,1)}; return f; }

function readGist(g){
  ownerLogin=g.owner&&g.owner.login||ownerLogin;
  var f=g.files&&g.files[FILE];
  if(!f) return Promise.reject({kind:'nf'});
  if(f.truncated && f.raw_url) return fetch(f.raw_url).then(function(r){return r.text();});
  return Promise.resolve(f.content);
}
function load(){
  if(!gistId) return Promise.resolve();
  return gh('/gists/'+gistId,{token:editable?token:null}).then(function(r){
    if(r.status===404) throw {kind:'nf'};
    if(r.status===403||r.status===429) throw {kind:'rl'};
    if(!r.ok) throw {kind:'net'};
    return r.json();
  }).then(readGist).then(function(text){
    var s=normalize(JSON.parse(text));
    if(busy) return;
    if(!state || JSON.stringify(s)!==JSON.stringify(state)){
      state=s; render();
      if(!editable && vCur && $('dv').open && !vAnim){ var nv=vetoOf(vCur.id); if(nv){ vCur.v=clone(nv); renderVeto(); } }
    }
  }).catch(function(e){
    var k=e&&e.kind;
    if(state){ if(k==='rl') toast('GitHub тимчасово обмежив оновлення. Сітка оновиться трохи пізніше.'); return; }
    if(k==='nf') showGate('<h2>Сітку не знайдено</h2><p>Перевірте посилання: можливо, воно скопійоване не повністю.</p>');
    else if(k==='rl') showGate('<h2>Забагато запитів</h2><p>GitHub тимчасово обмежив кількість переглядів з вашої мережі. Оновіть сторінку за кілька хвилин.</p>');
    else showGate('<h2>Не вдалося завантажити сітку</h2><p>Перевірте інтернет-з’єднання та оновіть сторінку.</p>');
  });
}
function checkOwner(tok){
  return gh('/user',{token:tok}).then(function(r){
    if(r.status===401) throw {kind:'bad'};
    if(!r.ok) throw {kind:'net'};
    return r.json();
  }).then(function(u){
    if(ownerLogin && u.login!==ownerLogin) throw {kind:'other',login:u.login};
    return u.login;
  });
}
function save(next,changedId){
  if(busy||!editable) return;
  busy=true;
  next.updatedAt=Date.now();
  if($('dm').open) $('dm').close();
  if($('dp').open) $('dp').close();
  $('saving').hidden=false;
  gh('/gists/'+gistId,{method:'PATCH',token:token,body:{files:fileBody(next)}}).then(function(r){
    busy=false; $('saving').hidden=true;
    if(r.ok){ state=next; fresh=changedId; render(); toast('Збережено. Друзі побачать зміни протягом пари хвилин.'); return; }
    if(r.status===401||r.status===403||r.status===404){ toast('GitHub не прийняв токен. Увійдіть як організатор ще раз.'); logout(); return; }
    toast('Не вдалося зберегти. Спробуйте ще раз.');
  },function(){
    busy=false; $('saving').hidden=true;
    toast('Не вдалося зберегти. Перевірте з’єднання і спробуйте ще раз.');
  });
}
function logout(){ token=null; editable=false; try{localStorage.removeItem(TOKEN_KEY);}catch(e){} render(); }

/* ---------- organizer login ---------- */
$('auth-btn').onclick=function(){
  if(editable){ logout(); toast('Ви вийшли. Тепер сторінка лише для перегляду.'); return; }
  $('dl-token').value=''; $('dl-err').hidden=true; $('dl').showModal();
};
$('dl-cancel').onclick=function(){ $('dl').close(); };
$('dl-ok').onclick=function(){
  var tok=$('dl-token').value.trim(), err=$('dl-err');
  if(!tok){ err.textContent='Вставте токен.'; err.hidden=false; return; }
  checkOwner(tok).then(function(){
    token=tok; editable=true; try{localStorage.setItem(TOKEN_KEY,tok);}catch(e){}
    $('dl').close(); render(); toast('Готово, тепер можна вносити результати.');
  },function(e){
    var k=e&&e.kind;
    err.textContent= k==='bad' ? 'Токен недійсний. Перевірте, чи скопійовано його повністю.'
      : k==='other' ? 'Цей токен належить акаунту '+e.login+', а сітку створив '+ownerLogin+'.'
      : 'Не вдалося перевірити токен. Спробуйте ще раз.';
    err.hidden=false;
  });
};

$('copy-link').onclick=function(){
  var url=location.href.split('#')[0];
  function done(){ toast('Посилання скопійовано. Надішліть його друзям.'); }
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done,function(){ window.prompt('Скопіюйте посилання:',url); });
  else window.prompt('Скопіюйте посилання:',url);
};

/* ---------- first-time setup (no ?id= in the address) ---------- */
function showSetup(){
  showGate(
    '<h2>Створення сітки</h2>'+
    '<p>Цю сторінку відкрито без посилання на конкретну сітку. Якщо ви організатор, створіть сітку тут, і ви отримаєте посилання для друзів.</p>'+
    '<ol><li><a href="https://github.com/settings/tokens/new?scopes=gist&amp;description=CS2%20bracket" target="_blank" rel="noopener">Створіть токен GitHub</a> з дозволом лише <b>gist</b> (він уже відмічений за посиланням).</li><li>Скопіюйте токен і вставте його нижче.</li></ol>'+
    '<label class="field"><span>Токен GitHub</span><input id="su-token" type="password" autocomplete="off" spellcheck="false" placeholder="ghp_…"></label>'+
    '<p class="err" id="su-err" hidden></p>'+
    '<button type="button" class="btn primary" id="su-go">Створити сітку</button>'
  );
  $('su-go').onclick=function(){
    var tok=$('su-token').value.trim(), err=$('su-err');
    if(!tok){ err.textContent='Вставте токен.'; err.hidden=false; return; }
    $('su-go').disabled=true; $('su-go').textContent='Створюю…';
    var fresh0=clone(DEFAULT_STATE); fresh0.updatedAt=Date.now();
    gh('/gists',{method:'POST',token:tok,body:{description:'Турнірна сітка CS2',public:false,files:fileBody(fresh0)}}).then(function(r){
      if(r.status===401) throw {kind:'bad'};
      if(r.status===403||r.status===404) throw {kind:'scope'};
      if(!r.ok) throw {kind:'net'};
      return r.json();
    }).then(function(g){
      gistId=g.id; ownerLogin=g.owner&&g.owner.login; token=tok; editable=true;
      try{ localStorage.setItem(TOKEN_KEY,tok); }catch(e){}
      try{ history.replaceState(null,'',location.pathname+'?id='+g.id); }catch(e){}
      state=fresh0; render(); startPolling();
      toast('Сітку створено. Натисніть «Скопіювати посилання» внизу, щоб поділитися.');
    },function(e){
      $('su-go').disabled=false; $('su-go').textContent='Створити сітку';
      var k=e&&e.kind;
      err.textContent= k==='bad' ? 'Токен недійсний. Перевірте, чи скопійовано його повністю.'
        : k==='scope' ? 'У токена немає дозволу gist. Створіть новий токен за посиланням вище.'
        : 'Не вдалося створити сітку. Перевірте з’єднання і спробуйте ще раз.';
      err.hidden=false;
    });
  };
}

  if(pollT) return;

    if(document.hidden||busy||$('dm').open||$('dp').open||(editable&&$('dv').open)) return;
    load();
  },POLL_MS);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden && !busy) load(); });
}

var MAPBY={}; MAPS.forEach(function(m){MAPBY[m.id]=m;});
var SLOTS=[{t:'Карта 1',w:'AK-47'},{t:'Карта 2',w:'AWP'},{t:'Карта 3, десайдер',w:'Desert Eagle'}];
var SIDE=['ct','t'];
var reduceMotion=false; try{ reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}

function rnd(n){ try{ var a=new Uint32Array(1); crypto.getRandomValues(a); return a[0]%n; }catch(e){ return Math.floor(Math.random()*n); } }
function seqFor(v){
  var F=v.first,S=1-F;
  // fmt 2: A ban, B ban, A pick (map 1), B pick (map 2), B ban, A ban, decider
  if(v.fmt===2) return [{p:F,a:'ban'},{p:S,a:'ban'},{p:F,a:'pick',slot:0},{p:S,a:'pick',slot:1},{p:S,a:'ban'},{p:F,a:'ban'}];
  return [{p:F,a:'ban'},{p:F,a:'ban'},{p:F,a:'pick',slot:0},{p:S,a:'ban'},{p:S,a:'ban'},{p:S,a:'pick',slot:1}];
}
function vetoValid(v,pp){ return !!(v && pp && v.pa===pp[0] && v.pb===pp[1] && (v.first===0||v.first===1)); }
function vetoOf(id){ var v=state.vetos&&state.vetos[id]; return vetoValid(v,compute(state).P[id])?v:null; }
function vetoStage(v){ if(!v||v.first==null) return 'roll'; if((v.steps||[]).length<6) return 'veto'; if(!v.decider) return 'decider'; return 'done'; }
function mapStatus(v){
  var st={}; if(!v||v.first==null) return st;
  var seq=seqFor(v);
  (v.steps||[]).forEach(function(s,i){ var q=seq[i]; if(q) st[s.m]={kind:q.a,by:q.p,slot:q.slot}; });
  if(v.decider) st[v.decider]={kind:'pick',slot:2,dec:true};
  return st;
}
function vetoMaps(v){
  var out=[null,null,null], st=mapStatus(v);
  Object.keys(st).forEach(function(k){ if(st[k].kind==='pick') out[st[k].slot]=k; });
  return out;
}
function remainingMaps(v){ var st=mapStatus(v); return MAPS.filter(function(m){return !st[m.id];}).map(function(m){return m.id;}); }
function iconImg(id,cls,alt){ return '<img class="'+(cls||'')+'" src="'+ICON[id]+'" alt="'+esc(alt||'')+'" draggable="false">'; }

/* silent save used by the veto: keeps dialogs open */
function saveSilent(next){
  next.updatedAt=Date.now();
  return gh('/gists/'+gistId,{method:'PATCH',token:token,body:{files:fileBody(next)}}).then(function(r){
    if(r.ok){ state=next; render(); return true; }
    if(r.status===401||r.status===403||r.status===404){ toast('GitHub не прийняв токен. Увійдіть як організатор ще раз.'); logout(); }
    return false;
  },function(){ return false; });
}
function withVeto(id,v){ var next=clone(state); if(!next.vetos) next.vetos={}; if(v) next.vetos[id]=v; else delete next.vetos[id]; return next; }

/* ---------- veto dialog ---------- */
var vCur=null, vSaving=false, vAnim=false;
function openVeto(id,start){
  var pp=compute(state).P[id];
  if(pp[0]==null||pp[1]==null){ toast('Учасники цього матчу ще не визначені.'); return; }
  var v=vetoOf(id);
  vCur={id:id,pp:pp,v:v?clone(v):null};
  if(!$('dv').open) $('dv').showModal();
  if(!vCur.v){ if(start&&editable) spinRoulette(); else { $('dv').close(); toast('Карти для цього матчу ще не обрано.'); } return; }
  renderVeto();
  if(editable && vetoStage(vCur.v)==='decider') runDecider();
}
$('dv-close').onclick=function(){ $('dv').close(); };
$('dv').addEventListener('close',function(){ vAnim=false; if(cur && $('dm').open) renderMatchVeto(); });

function names(){ return [state.players[vCur.pp[0]],state.players[vCur.pp[1]]]; }
function headVeto(){
  var n=names();
  $('dv-h').textContent='Вибір карт, '+BYID[vCur.id].code;
  $('dv-sub').innerHTML='<span class="vs-p ct">'+iconImg('ct','vs-i','CT')+esc(n[0])+'</span><span class="vs-x">проти</span><span class="vs-p t">'+iconImg('t','vs-i','T')+esc(n[1])+'</span><span class="vs-bo">Bo3</span>';
}

function spinRoulette(){
  headVeto();
  var n=names(), winner=rnd(2), N=46, stop=38, cards='';
  for(var i=0;i<N;i++){
    var who=i===stop?winner:rnd(2);
    cards+='<div class="rc '+SIDE[who]+'"'+(i===stop?' id="rc-win"':'')+'>'+iconImg(SIDE[who],'rc-i',SIDE[who].toUpperCase())+'<span>'+esc(n[who])+'</span></div>';
  }
  $('dv-body').innerHTML='<div class="roll"><p class="roll-t">Хто першим банить і обирає карту?</p>'+
    '<div class="rl-win" id="rl-win"><div class="rl-strip" id="rl-strip">'+cards+'</div><div class="rl-mark" aria-hidden="true"></div></div>'+
    '<div class="roll-res" id="roll-res" aria-live="polite"></div></div>';
  var nv={pa:vCur.pp[0],pb:vCur.pp[1],first:winner,steps:[],decider:null,fmt:2,at:Date.now()};
  var saved=saveSilent(withVeto(vCur.id,nv));
  var strip=$('rl-strip'), win=$('rl-win');
  var STEP=166, CARD=156;
  var jitter=rnd(Math.floor(CARD*0.7))-Math.floor(CARD*0.35);
  var target=-(stop*STEP+CARD/2-win.clientWidth/2+jitter);
  var dur=reduceMotion?600:5600;
  vAnim=true;
  strip.style.transform='translateX(0px)';
  void strip.offsetWidth;
  strip.style.transition='transform '+dur+'ms cubic-bezier(.08,.6,.12,1)';
  strip.style.transform='translateX('+target+'px)';
  var done=false;
  function finish(){
    if(done) return; done=true; vAnim=false;
    var wc=$('rc-win'); if(wc) wc.classList.add('won');
    saved.then(function(ok){
      var res=$('roll-res'); if(!res) return;
      if(ok){
        vCur.v=nv;
        res.innerHTML='<div class="roll-win '+SIDE[winner]+'">'+iconImg(SIDE[winner],'roll-wi',SIDE[winner].toUpperCase())+'<div><small>Першим обирає</small><strong>'+esc(n[winner])+'</strong></div></div>'+
          '<button type="button" class="btn primary" id="roll-go">Перейти до банів</button>';
        $('roll-go').onclick=function(){ renderVeto(); };
      } else {
        res.innerHTML='<p class="err">Не вдалося зберегти результат рулетки.</p><button type="button" class="btn primary" id="roll-retry">Спробувати зберегти ще раз</button>';
        $('roll-retry').onclick=function(){ $('roll-retry').disabled=true; saved=saveSilent(withVeto(vCur.id,nv)); done=false; finish(); };
      }
    });
  }
  strip.addEventListener('transitionend',finish,{once:true});
  setTimeout(finish,dur+400);
}

function renderVeto(){
  if(!vCur||!vCur.v) return;
  headVeto();
  var v=vCur.v, n=names(), stage=vetoStage(v), st=mapStatus(v), maps=vetoMaps(v), seq=seqFor(v), k=(v.steps||[]).length;
  // series
  var h='<div class="series">';
  SLOTS.forEach(function(s,i){
    var id=maps[i], by=i<2?(i===0?v.first:1-v.first):null;
    h+='<div class="slot'+(id?' filled':'')+(i===2?' dec':' '+SIDE[by])+'">'+
      '<div class="slot-h"><span>'+s.t+'</span><b>'+s.w+'</b></div>'+
      '<div class="slot-m">'+(id?iconImg(id,'slot-i',MAPBY[id].name):'<span class="slot-q">?</span>')+'</div>'+
      '<div class="slot-n">'+(id?esc(MAPBY[id].name):'Ще не обрано')+'</div>'+
      '<div class="slot-by">'+(i===2?'Випадковий вибір':'Обирає '+esc(n[by]))+'</div></div>';
  });
  h+='</div>';
  // 7-step timeline
  h+='<ol class="vsteps">';
  seq.forEach(function(q,i){
    var state_=i<k?' done':(i===k&&stage==='veto'?' now':'');
    var mapTxt=i<k?MAPBY[v.steps[i].m].name:'';
    h+='<li class="'+SIDE[q.p]+' '+q.a+state_+'"><b>'+(i+1)+'</b>'+iconImg(SIDE[q.p],'vst-i','')+'<span>'+(q.a==='ban'?'Бан ':'Пік ')+esc(n[q.p])+(mapTxt?': '+esc(mapTxt):'')+'</span></li>';
  });
  h+='<li class="dec'+(v.decider?' done':(stage==='decider'?' now':''))+'"><b>7</b><span>Десайдер'+(v.decider?': '+esc(MAPBY[v.decider].name):'')+'</span></li></ol>';
  // turn banner
  var turn='', act=null;
  if(stage==='veto'){
    var q=seq[k]; act=q.a;
    var banNo=seq.slice(0,k).filter(function(x){return x.p===q.p&&x.a==='ban';}).length+1;
    turn='<div class="turn '+SIDE[q.p]+' '+q.a+'">'+iconImg(SIDE[q.p],'turn-i',SIDE[q.p].toUpperCase())+'<div><strong>'+esc(n[q.p])+'</strong><span>'+
      (q.a==='ban'?'банить карту ('+banNo+'-й бан)':'обирає '+(q.slot===0?'карту 1 серії (AK-47)':'карту 2 серії (AWP)'))+'</span></div>'+
      '<span class="turn-step">Крок '+(k+1)+' з 7'+(editable?'':'<br><em>Голосування проводить організатор</em>')+'</span></div>';
  } else if(stage==='decider'){
    turn='<div class="turn dec"><div><strong>Десайдер</strong><span>Третя карта (Desert Eagle) обирається випадково з тих, що залишились.</span></div>'+
      (editable?'<button type="button" class="btn primary" id="dec-go">Обрати десайдер</button>':'')+'</div>';
  } else {
    turn='<div class="turn fin"><div><strong>Карти обрано</strong><span>'+maps.map(function(id,i){return esc(MAPBY[id].name)+' ('+SLOTS[i].w+')';}).join(', ')+'</span></div></div>';
  }
  // map grid
  var g='<div class="maps'+(act?' act-'+act:'')+'" id="maps">';
  MAPS.forEach(function(m){
    var s=st[m.id], cls='mapc', tag='';
    if(s){
      if(s.kind==='ban'){ cls+=' ban'; tag='<span class="tag">Бан: '+esc(n[s.by])+'</span>'; }
      else { cls+=' pick '+(s.dec?'dec':SIDE[s.by]); tag='<span class="tag">'+(s.slot===2?'Десайдер':'Карта '+(s.slot+1))+', '+SLOTS[s.slot].w+'</span>'; }
    }
    if(!s && stage==='done') cls+=' idle';
    var can=editable&&stage==='veto'&&!s;
    g+='<button type="button" class="'+cls+'" data-map="'+m.id+'"'+(can?'':' disabled')+(can?' aria-label="'+esc((act==='ban'?'Забанити ':'Обрати ')+m.name)+'"':'')+'>'+
      '<span class="mapc-art">'+iconImg(m.id,'mapc-i','')+'</span><span class="mapc-n">'+esc(m.name)+'</span><span class="mapc-c">'+m.code+'</span>'+tag+'</button>';
  });
  g+='</div>';
  var foot='<div class="vfoot">'+
    (editable&&((v.steps||[]).length||v.decider)?'<button type="button" class="btn ghost" id="v-undo">Скасувати останній крок</button>':'')+
    '<span class="spacer"></span><span class="vsave" id="vsave"></span>'+
    '<button type="button" class="btn'+(stage==='done'?' primary':'')+'" id="v-close2">'+(stage==='done'?'Готово':'Закрити')+'</button></div>';
  $('dv-body').innerHTML=h+turn+g+foot;
  $('v-close2').onclick=function(){ $('dv').close(); };
  if($('v-undo')) $('v-undo').onclick=undoStep;
  if($('dec-go')) $('dec-go').onclick=runDecider;
  $('maps').onclick=function(e){ var b=e.target.closest('.mapc:not([disabled])'); if(b) doStep(b.getAttribute('data-map')); };
}

function commitVeto(nv,prev){
  vSaving=true; vCur.v=nv; renderVeto(); if($('vsave')) $('vsave').textContent='Зберігаю…';
  return saveSilent(withVeto(vCur.id,nv)).then(function(ok){
    vSaving=false;
    if(!ok){ vCur.v=prev; toast('Не вдалося зберегти крок. Спробуйте ще раз.'); }
    if($('dv').open && !vAnim) renderVeto();
    return ok;
  });
}
function doStep(mapId){
  if(!editable||vSaving||vAnim) return;
  var v=vCur.v; if(vetoStage(v)!=='veto'||mapStatus(v)[mapId]) return;
  var nv=clone(v); nv.steps.push({m:mapId});
  commitVeto(nv,v).then(function(ok){ if(ok && vetoStage(nv)==='decider') runDecider(); });
}
function undoStep(){
  if(!editable||vSaving||vAnim) return;
  var v=vCur.v, nv=clone(v);
  if(nv.decider) nv.decider=null; else if(nv.steps.length) nv.steps.pop(); else return;
  commitVeto(nv,v);
}
function runDecider(){
  if(!editable||vSaving||vAnim) return;
  var v=vCur.v; if(vetoStage(v)!=='decider') return;
  var rem=remainingMaps(v); if(!rem.length) return;
  var chosen=rem[rnd(rem.length)], nv=clone(v); nv.decider=chosen;
  vAnim=true; vSaving=true;
  if($('dec-go')) $('dec-go').disabled=true;
  var saved=saveSilent(withVeto(vCur.id,nv));
  var cards=rem.map(function(id){ return document.querySelector('.mapc[data-map="'+id+'"]'); });
  var i=0, delay=70;
  // the last highlighted card must be the chosen map
  var ticks=reduceMotion?1:(function(){ var t=16; while(t%rem.length!==(rem.indexOf(chosen)+1)%rem.length) t++; return t; })();
  function tick(){
    cards.forEach(function(c){ if(c) c.classList.remove('roll'); });
    var c=cards[i%rem.length]; if(c) c.classList.add('roll');
    i++;
    if(i<ticks){ delay=Math.min(520,delay*1.17); setTimeout(tick,delay); }
    else setTimeout(end,650);
  }
  function end(){
    saved.then(function(ok){
      vAnim=false; vSaving=false;
      if(ok){ vCur.v=nv; }
      else toast('Не вдалося зберегти десайдер. Натисніть «Обрати десайдер» ще раз.');
      if($('dv').open) renderVeto();
    });
  }
  tick();
}

/* veto block inside the organizer's match dialog */
function renderMatchVeto(){
  if(!cur) return;
  var id=cur.m.id, v=vetoOf(id), played=!!compute(state).R[id], b=$('dm-veto');
  if(!v && played){ b.hidden=true; return; }
  var h='<span class="lbl">Карти, Bo3</span>';
  if(!v){
    h+='<p class="vb-t">Карти ще не обрано. Рулетка визначить, хто першим банить і обирає.</p><button type="button" class="btn primary" id="vb-start">Розпочати голосування</button>';
  } else {
    var maps=vetoMaps(v), stage=vetoStage(v);
    h+='<div class="vb-maps">'+SLOTS.map(function(s,i){ var id=maps[i];
      return '<div class="vb-m">'+(id?iconImg(id,'vb-i',MAPBY[id].name):'<span class="vb-q">?</span>')+'<span>'+(id?esc(MAPBY[id].name):'—')+'</span><small>'+s.w+'</small></div>'; }).join('')+'</div>'+
      '<div class="vb-act"><button type="button" class="btn'+(stage==='done'?'':' primary')+'" id="vb-open">'+(stage==='done'?'Переглянути вибір':'Продовжити голосування')+'</button>'+
      '<button type="button" class="btn ghost" id="vb-reset">Почати заново</button></div>';
  }
  b.innerHTML=h; b.hidden=false;
  if($('vb-start')) $('vb-start').onclick=function(){ $('dm').close(); openVeto(id,true); };
  if($('vb-open')) $('vb-open').onclick=function(){ $('dm').close(); openVeto(id,false); };
  if($('vb-reset')) $('vb-reset').onclick=function(){
    var btn=$('vb-reset');
    if(!btn.classList.contains('confirm')){ btn.classList.add('confirm'); btn.textContent='Точно почати заново?'; return; }
    btn.disabled=true;
    saveSilent(withVeto(id,null)).then(function(ok){ if(!ok) toast('Не вдалося скинути вибір карт.'); renderMatchVeto(); });
  };
}

];

};
var TIERBY={}; TIERS.forEach(function(t){TIERBY[t.k]=t;});
var ODDS_TOTAL=TIERS.reduce(function(a,t){return a+t.odds;},0);
function drawItem(){
  var r=rnd(ODDS_TOTAL), acc=0, tier=TIERS[TIERS.length-1];
  for(var i=0;i<TIERS.length;i++){ acc+=TIERS[i].odds; if(r<acc){ tier=TIERS[i]; break; } }
  var list=ITEMS[tier.k], it=list[rnd(list.length)];
  return {t:tier.k,e:it[0],n:it[1]};
}
var CASE_SVG='<svg viewBox="0 0 120 92" aria-hidden="true"><defs><linearGradient id="cg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4B5A3E"/><stop offset="1" stop-color="#2C3524"/></linearGradient><linearGradient id="cg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE27A"/><stop offset="1" stop-color="#E4A42C"/></linearGradient></defs>'+
  '<rect x="44" y="4" width="32" height="14" rx="5" fill="none" stroke="#1E2419" stroke-width="5"/>'+
  '<rect x="6" y="15" width="108" height="72" rx="9" fill="url(#cg1)" stroke="#1E2419" stroke-width="3"/>'+
  '<rect x="6" y="41" width="108" height="7" fill="#1E2419" opacity=".55"/>'+
  '<path d="M6 30v-6a9 9 0 0 1 9-9h8v15zM114 30v-6a9 9 0 0 0-9-9h-8v15zM6 72v6a9 9 0 0 0 9 9h8V72zM114 72v6a9 9 0 0 1-9 9h-8V72z" fill="#A9B3BC"/>'+
  '<circle cx="60" cy="52" r="17" fill="#1E2419"/><circle cx="60" cy="52" r="14" fill="url(#cg2)"/>'+
  '<path d="M60 42.5l2.9 6.1 6.6.8-4.9 4.5 1.3 6.6L60 57.2l-5.9 3.3 1.3-6.6-4.9-4.5 6.6-.8z" fill="#5A3B05"/></svg>';

var caseCount=0; try{ caseCount=parseInt(localStorage.getItem('cs2-cases')||'0',10)||0; }catch(e){}
var caseSpinning=false;
function itemCard(it,hide,cls){
  var gold=it.t==='gold';
  return '<div class="ci t-'+it.t+(cls?' '+cls:'')+'"><span class="ci-e">'+(gold&&hide?'★':it.e)+'</span><span class="ci-n">'+esc(gold&&hide?'Рідкісний особливий предмет':it.n)+'</span></div>';
}
function caseHome(){
  var grid='';
  TIERS.slice().forEach(function(t){ ITEMS[t.k].forEach(function(it){ grid+=itemCard({t:t.k,e:it[0],n:it[1]},true,'small'); }); });
  $('dc-body').innerHTML='<div class="case-hero"><div class="case-big">'+CASE_SVG+'</div>'+
    '<div class="case-info"><p>У кейсі 60 предметів: від картоплі до надувної жінки. Шанси як у справжньому CS: золото випадає приблизно раз на 400 відкриттів.</p>'+
    '<button type="button" class="btn primary case-go" id="dc-go">Відкрити кейс</button><p class="case-count">Ви відкрили кейсів: '+caseCount+'</p></div></div>'+
    '<h3 class="case-h">Вміст кейсу</h3><div class="case-grid">'+grid+'</div>';
  $('dc-go').onclick=openCase;
}
function openCase(){
  if(caseSpinning) return;
  caseSpinning=true;
  var N=56, stop=48, win=drawItem(), cards='';
  for(var i=0;i<N;i++) cards+=itemCard(i===stop?win:drawItem(),true,i===stop?'win':'');
  $('dc-body').innerHTML='<div class="rl-win case-win" id="cs-win"><div class="rl-strip" id="cs-strip">'+cards+'</div><div class="rl-mark" aria-hidden="true"></div></div><div class="case-res" id="cs-res" aria-live="polite"></div>';
  var strip=$('cs-strip'), box=$('cs-win'), STEP=166, CARD=156;
  var jitter=rnd(Math.floor(CARD*0.8))-Math.floor(CARD*0.4);
  var target=-(stop*STEP+CARD/2-box.clientWidth/2+jitter), dur=reduceMotion?600:6200;
  strip.style.transform='translateX(0px)'; void strip.offsetWidth;
  strip.style.transition='transform '+dur+'ms cubic-bezier(.08,.6,.12,1)';
  strip.style.transform='translateX('+target+'px)';
  var done=false;
  function finish(){
    if(done) return; done=true; caseSpinning=false;
    caseCount++; try{ localStorage.setItem('cs2-cases',String(caseCount)); }catch(e){}
    var tier=TIERBY[win.t], gold=win.t==='gold';
    $('cs-res').innerHTML='<div class="drop t-'+win.t+'"><span class="drop-e">'+win.e+'</span><div><small>'+esc(tier.n)+'</small><strong>'+esc(win.n)+'</strong></div></div>'+

      '<button type="button" class="btn'+(gold?'':' primary')+'" id="dc-again">Відкрити ще раз</button><button type="button" class="btn ghost" id="dc-back">До вмісту кейсу</button></div>';
    $('dc-again').onclick=openCase;
    $('dc-back').onclick=caseHome;
    if(gold) $('dc-claim').addEventListener('click',function(){ setTimeout(function(){ var c=$('dc-claim'); if(c) c.textContent='Вас зарікролили 🕺'; },400); });
  }
  strip.addEventListener('transitionend',finish,{once:true});
  setTimeout(finish,dur+400);
}
$('case-fab').onclick=function(){ caseHome(); $('dc').showModal(); };
$('dc-close').onclick=function(){ $('dc').close(); };

/* ---------- background music ---------- */
var MUSIC_KEY='cs2-music-off', VOLUME=0.15;
var audio=$('music'), musicBtn=$('music-btn'), musicOff=false, musicOk=true;
try{ musicOff=sessionStorage.getItem(MUSIC_KEY)==='1'; }catch(e){}
audio.volume=VOLUME;
function musicLabel(){
  var on=!audio.paused;
  $('music-txt').textContent=on?'Зупинити музику':'Увімкнути музику';
  $('music-ico').textContent=on?'❚❚':'▶';
  musicBtn.setAttribute('aria-pressed',String(on));
}
function tryPlay(){
  if(!musicOk) return Promise.resolve(false);
  audio.volume=VOLUME;
  var pr;
  try{ pr=audio.play(); }catch(e){ return Promise.resolve(false); }
  return (pr&&pr.then?pr:Promise.resolve()).then(function(){ musicLabel(); return true; },function(){ musicLabel(); return false; });
}
function hideSplash(){ $('splash').hidden=true; }
audio.addEventListener('error',function(){ musicOk=false; musicBtn.hidden=true; hideSplash(); });
audio.addEventListener('play',musicLabel); audio.addEventListener('pause',musicLabel);
musicBtn.onclick=function(){
  if(audio.paused){ musicOff=false; try{sessionStorage.removeItem(MUSIC_KEY);}catch(e){} tryPlay(); }
  else{ musicOff=true; try{sessionStorage.setItem(MUSIC_KEY,'1');}catch(e){} audio.pause(); }
};
$('splash').onclick=function(e){
  if(e.target.closest('#splash-quiet')){ musicOff=true; try{sessionStorage.setItem(MUSIC_KEY,'1');}catch(err){} hideSplash(); return; }
  if(e.target.closest('.splash-card') && !e.target.closest('#splash-go')) return;
  musicOff=false; tryPlay(); hideSplash();
};
// fallback: any first tap or key press also starts the music
function firstGesture(e){
  if(musicOff||!audio.paused||(e&&e.target&&e.target.closest&&e.target.closest('#music-btn,#splash'))) return;
  tryPlay();
}
document.addEventListener('pointerdown',firstGesture,true);
document.addEventListener('keydown',firstGesture,true);
musicLabel();
if(!musicOff){
  tryPlay().then(function(ok){
    // the browser blocked autoplay with sound: ask for one click to enter
    if(!ok && musicOk && !musicOff && audio.paused){ $('splash').hidden=false; $('splash-go').focus(); }
  });
}

  });
}
