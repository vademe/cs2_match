:root{
  /* aliases used by inline styles and older rules */
  --bg:var(--paper); --panel:var(--paper); --panel2:var(--paper); --muted:var(--ink); --line:var(--ink);
  --hatch:repeating-linear-gradient(-45deg,var(--ink) 0 2px,transparent 2px 6px);
  --hatch-fine:repeating-linear-gradient(-45deg,var(--ink) 0 1px,transparent 1px 5px);
  --fade:repeating-linear-gradient(-45deg,var(--paper) 0 2px,transparent 2px 5px);
  --ct:var(--ink); --t:var(--hatch);
  --disp:"Rubik Dirt","Impact","Arial Black",system-ui,sans-serif;
  --ui:"Rubik",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; min-height:100%; background-color:var(--paper); color:var(--ink);
  background-image:radial-gradient(var(--ink) .9px,transparent 1.3px); background-size:26px 26px;
  font-family:var(--ui); font-size:15px; line-height:1.45; font-weight:500;
}
body::before{content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; background:var(--ink);
  -webkit-mask-image:var(--noise); mask-image:var(--noise); -webkit-mask-size:340px; mask-size:340px}
button,input{font:inherit;color:inherit}
::selection{background:var(--ink); color:var(--paper)}
.ink-img{display:block}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) img.ink{filter:invert(1)} }
:root[data-theme="dark"] img.ink{filter:invert(1)}
.mask{background:var(--ink); -webkit-mask:var(--src) center/contain no-repeat; mask:var(--src) center/contain no-repeat}
.holes{position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden; color:var(--ink)}
.holes span{display:block}
.holes svg{display:block; overflow:visible}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
[hidden]{display:none !important}

/* ---------- buttons & inputs ---------- */
.btn{border:2px solid var(--ink); background:var(--paper); border-radius:0; padding:7px 14px; font-family:var(--mono); font-weight:800; font-size:13px; letter-spacing:.04em; text-transform:uppercase; cursor:pointer; transition:transform .08s, box-shadow .08s}
.btn:hover{background:var(--ink); color:var(--paper)}
.btn:active{transform:translate(2px,2px)}
.btn.primary{background:var(--ink); color:var(--paper); box-shadow:4px 4px 0 var(--ink); border-color:var(--ink)}
.btn.primary:hover{transform:translate(-1px,-1px); box-shadow:6px 6px 0 var(--ink); outline:2px solid var(--paper); outline-offset:-5px}
.btn.ghost{background:var(--paper); border-style:dashed}
.btn:disabled{cursor:default; background:var(--hatch-fine),var(--paper); color:var(--ink)}
.btn:focus-visible,.zoom button:focus-visible,.pick:focus-visible,input:focus-visible,.pl:focus-visible,.mapc:focus-visible,.case-fab:focus-visible,.vx:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
input{border-radius:0}
.spacer{flex:1}

/* ---------- hero ---------- */
.hero{position:relative; padding:26px 28px 10px; max-width:1900px}
.topline{display:flex; justify-content:flex-end; gap:10px; margin:0 0 4px; position:relative; z-index:2}
.hero-grid{display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:end; gap:10px 30px}
.hero-main{position:relative; z-index:1; min-width:0}
.logo{--src:var(--img-logo); width:min(620px,100%); aspect-ratio:960/445; margin:0 0 6px -10px}
h1{margin:0; font-family:var(--disp); font-weight:400; font-size:clamp(28px,4.4vw,58px); line-height:.95; text-transform:uppercase; letter-spacing:.01em}
h1::after{content:"CS2 // double elimination // bo3"; display:block; font-family:var(--mono); font-size:12px; letter-spacing:.18em; margin-top:12px; font-weight:800}
.sides{display:none}
.meta{font-family:var(--mono); font-size:13px; margin:12px 0 0; max-width:70ch}
.meta b{background:var(--ink); color:var(--paper); padding:0 5px}
.mascot{--src:var(--img-dog); width:clamp(150px,24vw,330px); aspect-ratio:560/535; transform:rotate(-5deg); margin:0 10px -20px 0; position:relative}
.mascot::after{content:"MASCOT // NO.9"; position:absolute; right:-6px; bottom:12%; background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:10px; font-weight:800; letter-spacing:.12em; padding:3px 7px; transform:rotate(9deg)}
#champ:empty{display:none}
.champ{position:relative; display:flex; align-items:center; gap:18px; margin-top:22px; padding:14px 22px 14px 14px; background:var(--ink); color:var(--paper); max-width:640px; box-shadow:8px 8px 0 var(--hatch-fine)}
.champ .cup{--src:var(--img-trophy); width:92px; aspect-ratio:419/440; background:var(--paper); flex:none}
.champ small{display:block; font-family:var(--mono); font-weight:800; font-size:12px; letter-spacing:.14em; text-transform:uppercase}
.champ strong{display:block; font-family:var(--disp); font-weight:400; font-size:clamp(28px,4vw,42px); line-height:1.05; margin-top:2px; word-break:break-word}
.champ span{display:block; font-family:var(--mono); font-size:12.5px; margin-top:6px}


/* bar */
.bar{display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; padding:0 28px 16px}
.legend{display:flex; gap:14px; font-family:var(--mono); font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.06em}
.legend span{display:inline-flex; align-items:center; gap:7px}
.legend i{width:16px; height:16px; display:inline-block; border:2px solid var(--ink)}
.hint{font-family:var(--mono); font-size:12.5px}
.zoom{display:inline-flex; align-items:center; border:2px solid var(--ink); background:var(--paper)}
.zoom button{border:0; background:none; padding:6px 11px; cursor:pointer; font-family:var(--mono); font-weight:800; min-width:34px; text-transform:uppercase; font-size:12.5px}
.zoom button+button,.zoom output+button{border-left:2px solid var(--ink)}
.zoom button:hover{background:var(--ink); color:var(--paper)}
.zoom output{font-family:var(--mono); font-size:12.5px; font-weight:700; min-width:52px; text-align:center; border-left:2px solid var(--ink); padding:6px 0}
.mode{display:inline-flex; align-items:center; gap:7px; font-family:var(--mono); font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.06em}
.mode::before{content:""; width:10px; height:10px; background:var(--ink); animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}


/* ---------- layout / roster ---------- */
.layout{display:grid; grid-template-columns:240px minmax(0,1fr); align-items:start}
.stage{overflow:auto; padding:0 0 28px; -webkit-overflow-scrolling:touch}
.sizer{position:relative; margin:0 28px}
.layout .sizer{margin:0 28px 0 14px}
.canvas{position:absolute; left:0; top:0; transform-origin:0 0}
.canvas svg{position:absolute; left:0; top:0; overflow:visible}
.roster{position:sticky; top:calc(env(safe-area-inset-top,0px) + 12px); padding:0 0 24px 28px}
.roster-h{margin:0 0 10px; font-family:var(--disp); font-weight:400; font-size:24px; text-transform:uppercase}
.roster-list{display:flex; flex-direction:column; gap:6px}
.pl{position:relative; display:grid; grid-template-columns:minmax(0,1fr) auto; column-gap:10px; align-items:center; width:100%; text-align:left; border:2px solid var(--ink); background:var(--paper); border-radius:0; padding:6px 10px 7px 16px; cursor:pointer}
.pl::before{content:""; position:absolute; left:0; top:0; bottom:0; width:7px; background:var(--k,transparent); border-right:2px solid var(--ink)}
.pl.k-ub{--k:var(--ink)} .pl.k-lb{--k:var(--hatch)} .pl.k-out::before{display:none} .pl.k-out{padding-left:10px; border-style:dashed} .pl.k-champ{--k:var(--ink)}
.pl:hover{box-shadow:4px 4px 0 var(--ink); transform:translate(-1px,-1px)}
.pl[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
.pl[aria-pressed="true"]::before{background:var(--paper); border-color:var(--paper)}
.pl[aria-pressed="true"] .ic{background:var(--paper)}
.pl-n{grid-column:1; grid-row:1; font-weight:800; font-size:15px; line-height:1.2; display:flex; align-items:center; gap:6px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pl.k-out .pl-n{text-decoration:line-through; text-decoration-thickness:2px}
.pl-s{grid-column:1; grid-row:2; font-family:var(--mono); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em}
.pl-pts{grid-column:2; grid-row:1/3; font-family:var(--disp); font-size:24px; text-align:right; line-height:.9; font-variant-numeric:tabular-nums}
.pl-pts small{display:block; font-family:var(--mono); font-size:9.5px; font-weight:800; margin-top:3px; letter-spacing:.06em; text-transform:uppercase}
.roster-hint{font-family:var(--mono); font-size:11.5px; margin:12px 0 0}
.ic{display:inline-block; flex:none; width:18px; height:18px; background:var(--ink); -webkit-mask:var(--src) center/contain no-repeat; mask:var(--src) center/contain no-repeat}
.ic.skull{--src:var(--img-skull)} .ic.trophy{--src:var(--img-trophy); width:20px; height:20px}

/* ---------- bracket ---------- */
.edge{fill:none; stroke:var(--ink); stroke-width:2; stroke-dasharray:5 5}
.edge.lit{stroke-dasharray:none; stroke-width:3}
.sect{position:absolute; font-family:var(--disp); font-weight:400; font-size:34px; line-height:1; white-space:nowrap; text-transform:uppercase; transform:rotate(-1.5deg)}
.sect::after{content:""; display:block; height:6px; margin-top:4px; background:var(--ink)}
.sect.lb::after{background:var(--hatch)}
.rl{position:absolute; width:232px; font-family:var(--mono); font-size:11px; font-weight:800; white-space:nowrap; text-transform:uppercase; letter-spacing:.1em}
.rl::before{content:"▸ "}
.rl.gf{font-family:var(--disp); font-weight:400; font-size:24px; letter-spacing:.02em; transform:rotate(-2deg)}
.rl.gf::before{content:""; display:inline-block; width:26px; height:26px; margin-right:6px; vertical-align:-4px; background:var(--ink); -webkit-mask:var(--img-trophy) center/contain no-repeat; mask:var(--img-trophy) center/contain no-repeat}
.m{position:absolute; width:232px; height:92px; background:var(--paper); border:2px solid var(--ink); border-radius:0; overflow:hidden}
.m::before{display:none}
.mh{height:24px; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:0 8px 0 9px; background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; font-weight:800; letter-spacing:.05em}
.mh .st{font-weight:700; font-size:10px; text-transform:uppercase}
.m.lb .mh{background:var(--hatch),var(--paper); color:var(--ink); border-bottom:2px solid var(--ink)}
.m.lb .mh>span{background:var(--paper); padding:0 5px; outline:2px solid var(--paper)}
.m.lb .mh>span:first-child{background:var(--ink); color:var(--paper); outline-color:var(--ink)}
.m.gf{border:6px double var(--ink); box-shadow:8px 8px 0 var(--ink)}
.m.gf .row{height:29px}
.m.gf .mh{height:22px}
.mh .mi{display:inline-flex; gap:3px; align-items:center; background:var(--paper); padding:1px 3px}
.mh .mi img,.mh .mi i{width:17px; height:17px; display:block; object-fit:contain}
.mh .mi i{border:1px dashed var(--ink); border-radius:50%}
.m.has-veto .mh{cursor:pointer}
.row{position:relative; height:33px; display:flex; align-items:center; justify-content:space-between; padding-left:9px; font-weight:700; font-size:14.5px}
.row+.row{border-top:2px solid var(--ink)}
.row .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding-right:8px}
.row .sc{flex:none; width:42px; height:100%; display:grid; place-items:center; font-family:var(--disp); font-size:17px; border-left:2px solid var(--ink); font-variant-numeric:tabular-nums}
.row.win{background:var(--ink); color:var(--paper)}
.row.win .nm{font-weight:900}
.row.win .nm::before{content:"✚ "; font-size:11px; vertical-align:1px}
.row.win .sc{border-left-color:var(--paper)}
.row.lose .nm{font-weight:500}
.row.elim .nm{text-decoration:line-through; text-decoration-thickness:2px}
.row.tbd .nm{font-family:var(--mono); font-weight:500; font-style:italic; font-size:11.5px; text-decoration:underline dashed; text-underline-offset:3px}
.row.hl .nm,.row.mine .nm{text-decoration:underline; text-decoration-thickness:3px; text-underline-offset:3px}
.row.mine{box-shadow:inset 6px 0 0 var(--ink)}
.row.win.mine{box-shadow:inset 6px 0 0 var(--paper)}
.row.mine .nm::after{content:" ◆"}
.m.edit{cursor:pointer}
.m.edit:hover{box-shadow:5px 5px 0 var(--ink)}
.m.gf.edit:hover{box-shadow:10px 10px 0 var(--ink)}
.m.edit:focus-visible{outline:3px solid var(--ink); outline-offset:4px}
.m.fresh{animation:stamp .6s ease-out}
@keyframes stamp{0%{transform:scale(1.08) rotate(-1deg)}100%{transform:none}}
.canvas.has-sel .m:not(.sel)::after{content:""; position:absolute; inset:0; background:var(--fade); pointer-events:none}
.canvas.has-sel .m.sel{box-shadow:7px 7px 0 var(--ink); z-index:1}
.canvas.has-sel .edge{stroke-dasharray:2 6}

/* ---------- summary ---------- */
.summary{padding:12px 28px 28px; max-width:1000px}
.summary h2,.roster-h{font-family:var(--disp)}
.summary h2{margin:0 0 4px; font-weight:400; font-size:34px; text-transform:uppercase}
.summary .sub{margin:0 0 14px; font-family:var(--mono); font-size:12.5px}
.tbl-wrap{overflow-x:auto; border:3px solid var(--ink); background:var(--paper); box-shadow:8px 8px 0 var(--hatch-fine)}
.tbl{width:100%; border-collapse:collapse; font-size:14.5px; min-width:640px}
.tbl th{text-align:right; font-family:var(--mono); font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:9px 14px; background:var(--ink); color:var(--paper); white-space:nowrap}
.tbl td{text-align:right; padding:9px 14px; border-top:2px solid var(--ink); font-variant-numeric:tabular-nums; white-space:nowrap}
.tbl tr:first-child td{border-top:0}
.tbl th:nth-child(2),.tbl td:nth-child(2),.tbl th:last-child,.tbl td:last-child{text-align:left}
.tbl td:nth-child(2){font-weight:800}
.tbl td:nth-child(2) .ic{vertical-align:-3px; margin-right:6px}
.tbl td.pts{font-family:var(--disp); font-size:19px}
.tbl td.rank{font-family:var(--disp); font-size:18px; width:44px}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{box-shadow:inset 0 -3px 0 var(--ink)}
.tbl tbody tr.on td{background:var(--ink); color:var(--paper)}
.tbl tbody tr.on .ic{background:var(--paper)}
.tbl .st{font-family:var(--mono); font-weight:700; font-size:11.5px; text-transform:uppercase}
.tbl .neg{text-decoration:underline dotted}

/* ---------- footer ---------- */
.foot{display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; padding:6px 120px 34px 28px; font-family:var(--mono); font-size:12px}
.foot .btn{font-size:12px; padding:6px 12px}
.foot-mark{display:flex; align-items:center; gap:10px; font-family:var(--mono); font-weight:800; letter-spacing:.12em; text-transform:uppercase}
.foot-mark .skull-big{--src:var(--img-skull); width:34px; aspect-ratio:396/420}

/* ---------- gate ---------- */
.gate{max-width:640px; margin:7vh auto 0; padding:0 20px}
.gate .card{background:var(--paper); border:3px solid var(--ink); padding:26px 24px; box-shadow:10px 10px 0 var(--ink)}
.gate .card::before{content:""; display:block; width:min(320px,80%); aspect-ratio:960/445; margin:-8px 0 14px -6px; background:var(--ink); -webkit-mask:var(--img-logo) left center/contain no-repeat; mask:var(--img-logo) left center/contain no-repeat}
.gate h2{margin:0 0 8px; font-family:var(--disp); font-weight:400; font-size:28px; text-transform:uppercase}
.gate p{margin:0 0 14px}
.gate ol{margin:0 0 16px; padding-left:20px} .gate li{margin-bottom:6px}
.gate a,.foot a{color:var(--ink); font-weight:800; text-decoration:underline; text-decoration-thickness:2px}
.gate .field{margin-bottom:12px}

/* ---------- dialogs ---------- */
dialog{border:3px solid var(--ink); border-radius:0; background:var(--paper); color:var(--ink); padding:0; width:min(460px,calc(100vw - 24px)); max-height:calc(100vh - 40px); box-shadow:10px 10px 0 var(--ink)}
dialog::backdrop{background:repeating-linear-gradient(-45deg,#000 0 1px,#fff 1px 7px)}

.dlg{padding:22px 22px 18px}
.dlg h2,.vhead h2{margin:0; font-family:var(--disp); font-weight:400; font-size:26px; text-transform:uppercase; line-height:1.05}
.dlg .sub{margin:6px 0 18px; font-family:var(--mono); font-size:12.5px}
.lbl{display:block; font-family:var(--mono); font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; margin:0 0 8px}
.picks{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px}
.pick{border:2px solid var(--ink); background:var(--paper); border-radius:0; padding:14px 10px; font-weight:900; font-size:16px; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pick:hover{background:var(--hatch-fine),var(--paper)}
.pick[aria-pressed="true"]{background:var(--ink); color:var(--paper); box-shadow:5px 5px 0 var(--ink)}
.pick[aria-pressed="true"]::before{content:"✚ "}
.score{display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center; margin-bottom:8px}
.score input{width:100%; text-align:center; font-family:var(--disp); font-size:30px; padding:6px; border:3px solid var(--ink); background:var(--paper)}
.score span{font-family:var(--disp); font-size:28px}
.score-names{display:grid; grid-template-columns:1fr auto 1fr; gap:10px; font-family:var(--mono); font-size:11.5px; text-align:center; margin-bottom:14px}
.score-names i{width:14px}
.note{font-family:var(--mono); font-size:12px; margin:0 0 14px; padding:9px 12px; border:2px dashed var(--ink)}
.err{font-family:var(--mono); font-size:12.5px; font-weight:800; margin:0 0 14px; padding:6px 10px; background:var(--ink); color:var(--paper)}
.err::before{content:"⚠ "}
.actions{display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; margin-top:6px}
.actions .left{margin-right:auto}
.plist{display:grid; grid-template-columns:1fr 1fr; gap:8px 10px; margin-bottom:16px}
.field{display:flex; flex-direction:column; gap:4px}
.field span{font-family:var(--mono); font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase}
.field input{padding:8px 10px; border:2px solid var(--ink); background:var(--paper); font-weight:700}
.field.wide{grid-column:1/-1}
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:10px 16px; font-family:var(--mono); font-size:13px; font-weight:700; max-width:calc(100vw - 32px); z-index:70; box-shadow:5px 5px 0 var(--hatch-fine)}
.saving{position:fixed; inset:0; background:repeating-linear-gradient(-45deg,var(--ink) 0 1px,transparent 1px 7px); display:grid; place-items:center; z-index:40}
.saving div{background:var(--ink); color:var(--paper); padding:14px 22px; font-family:var(--mono); font-weight:800; text-transform:uppercase; letter-spacing:.1em}


/* ---------- veto ---------- */
.vblock{border:2px solid var(--ink); padding:12px 14px 14px; margin:0 0 18px; background:var(--hatch-fine),var(--paper)}
.vblock>*{position:relative}
.vblock .lbl{display:inline-block; background:var(--ink); color:var(--paper); padding:2px 8px}
.vb-t{margin:0 0 12px; font-size:13px; background:var(--paper); padding:6px 8px; border:2px solid var(--ink)}
.vb-maps{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px}
.vb-m{display:flex; flex-direction:column; align-items:center; gap:2px; text-align:center; font-weight:800; font-size:13px; background:var(--paper); border:2px solid var(--ink); padding:6px 4px}
.vb-m small{font-family:var(--mono); font-weight:700; font-size:10.5px}
.vb-i{width:44px; height:44px; object-fit:contain}
.vb-q{width:44px; height:44px; border:2px dashed var(--ink); border-radius:50%; display:grid; place-items:center; font-family:var(--disp); font-size:20px}
.vb-act{display:flex; flex-wrap:wrap; gap:8px}
#vb-reset.confirm{background:var(--ink); color:var(--paper); border-style:solid}
dialog.vdlg{width:min(1060px,calc(100vw - 24px)); max-height:calc(100dvh - 24px); overflow:auto}
.vwrap{padding:22px 24px 20px}
.vhead{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:16px; padding-bottom:12px; border-bottom:3px solid var(--ink)}
.vhead h2{font-size:30px}
.vsub{display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; margin:8px 0 0; font-weight:900; font-size:16px}
.vs-p{display:inline-flex; align-items:center; gap:8px; padding:2px 10px 2px 2px; border:2px solid var(--ink)}
.vs-p.ct{background:var(--paper)}
.vs-p.t{border-style:dashed}
.vs-i{width:30px; height:30px; object-fit:cover; object-position:top}
.vs-x{font-family:var(--disp); font-weight:400; font-size:18px}
.vs-bo{font-family:var(--mono); font-size:11px; font-weight:800; background:var(--ink); color:var(--paper); padding:3px 8px}
.vx{border:2px solid var(--ink); background:var(--paper); width:40px; height:40px; border-radius:0; cursor:pointer; font-size:15px; font-weight:900; flex:none}
.vx:hover{background:var(--ink); color:var(--paper)}

/* roulette (veto + case) */
.roll{text-align:center}
.roll-t{margin:0 0 14px; font-family:var(--mono); font-weight:800; text-transform:uppercase; letter-spacing:.08em; font-size:12.5px}
.rl-win{position:relative; overflow:hidden; height:194px; border:3px solid var(--ink); background:var(--hatch-fine),var(--paper)}
.rl-strip{position:absolute; left:0; top:16px; display:flex; gap:10px; will-change:transform}
.rc{flex:none; width:156px; height:156px; background:var(--paper); border:2px solid var(--ink); display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:0; font-weight:900; font-size:15px; overflow:hidden; position:relative}
.rc-i{width:100%; height:112px; object-fit:cover; object-position:50% 10%}
.rc span{width:100%; padding:6px 6px 7px; border-top:2px solid var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; background:var(--paper)}
.rc::before{content:"CT"; position:absolute; top:6px; left:6px; z-index:1; font-family:var(--mono); font-size:11px; font-weight:800; background:var(--ink); color:var(--paper); padding:1px 6px}
.rc.t::before{content:"T"; background:var(--paper); color:var(--ink); border:2px dashed var(--ink)}
.rc.t span{border-top-style:dashed}
.rc.won{border-width:5px; box-shadow:0 0 0 4px var(--paper),0 0 0 7px var(--ink); transform:scale(1.04); transition:transform .3s}
.rl-mark{position:absolute; left:50%; top:0; bottom:0; width:4px; margin-left:-2px; background:var(--ink); z-index:2; box-shadow:0 0 0 2px var(--paper)}
.rl-mark::before,.rl-mark::after{content:""; position:absolute; left:50%; margin-left:-10px; border:10px solid transparent}
.rl-mark::before{top:-2px; border-top-color:var(--ink)}
.rl-mark::after{bottom:-2px; border-bottom-color:var(--ink)}
.roll-res{min-height:96px; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:14px 22px; margin-top:18px}
.roll-win{display:flex; align-items:center; gap:14px; text-align:left; animation:pop .4s ease-out; border:3px solid var(--ink); padding:8px 18px 8px 8px; box-shadow:6px 6px 0 var(--ink)}
.roll-win small{display:block; font-family:var(--mono); font-weight:800; font-size:11px; letter-spacing:.1em; text-transform:uppercase}
.roll-win strong{display:block; font-family:var(--disp); font-weight:400; font-size:30px; line-height:1.05}
.roll-wi{width:70px; height:70px; object-fit:cover; object-position:top; border:2px solid var(--ink)}
@keyframes pop{0%{transform:scale(.85) rotate(-2deg); opacity:0}100%{transform:none; opacity:1}}
.series{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:14px}
.slot{position:relative; border:2px solid var(--ink); background:var(--paper); padding:16px 12px 12px; text-align:center}
.slot::before{content:""; position:absolute; left:-2px; right:-2px; top:-2px; height:8px; background:var(--ink)}
.slot.t::before{background:var(--hatch),var(--paper); border:2px solid var(--ink)}
.slot.dec{border-style:dashed}
.slot.dec::before{background:repeating-linear-gradient(90deg,var(--ink) 0 10px,transparent 10px 16px)}
.slot.filled{box-shadow:6px 6px 0 var(--ink)}
.slot-h{display:flex; justify-content:space-between; gap:8px; font-family:var(--mono); font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.05em}
.slot-h b{background:var(--ink); color:var(--paper); padding:0 6px}
.slot-m{height:92px; display:grid; place-items:center; margin:8px 0 6px}
.slot-i{width:88px; height:88px; object-fit:contain; animation:pop .35s ease-out}
.slot-q{width:72px; height:72px; border:3px dashed var(--ink); border-radius:50%; display:grid; place-items:center; font-family:var(--disp); font-size:32px}
.slot-n{font-family:var(--disp); font-size:20px; text-transform:uppercase}
.slot:not(.filled) .slot-n{font-family:var(--mono); font-size:12px; font-weight:700}
.slot-by{font-family:var(--mono); font-size:11px; margin-top:2px; text-transform:uppercase}
.vsteps{list-style:none; display:flex; flex-wrap:wrap; gap:6px; padding:0; margin:0 0 14px}
.vsteps li{display:inline-flex; align-items:center; gap:7px; padding:3px 10px 3px 3px; border:2px solid var(--ink); background:var(--paper); font-family:var(--mono); font-size:11.5px; font-weight:700}
.vsteps li b{min-width:22px; height:22px; display:grid; place-items:center; background:var(--ink); color:var(--paper); font-size:11px}
.vsteps li.t b{background:var(--paper); color:var(--ink); outline:2px dashed var(--ink); outline-offset:-2px}
.vsteps li.dec b{background:var(--hatch),var(--paper); color:var(--ink)}
.vst-i{display:none}
.vsteps li.done{background:var(--ink); color:var(--paper)}
.vsteps li.done b{background:var(--paper); color:var(--ink)}
.vsteps li.done.ban span{text-decoration:line-through; text-decoration-thickness:2px}
.vsteps li.now{box-shadow:4px 4px 0 var(--ink); animation:nudge 1.1s ease-in-out infinite}
@keyframes nudge{50%{transform:translate(-1px,-1px); box-shadow:6px 6px 0 var(--ink)}}
.turn{position:relative; display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; padding:10px 16px 10px 22px; margin-bottom:14px; border:3px solid var(--ink); background:var(--paper)}
.turn::before{content:""; position:absolute; left:0; top:0; bottom:0; width:10px; background:var(--ink)}
.turn.t::before{background:var(--hatch),var(--paper); border-right:2px solid var(--ink)}
.turn.dec::before,.turn.fin::before{background:repeating-linear-gradient(0deg,var(--ink) 0 8px,transparent 8px 13px)}
.turn strong{display:block; font-family:var(--disp); font-weight:400; font-size:24px; line-height:1.05}
.turn>div>span{font-family:var(--mono); font-weight:800; font-size:12.5px; text-transform:uppercase}
.turn.ban>div>span{background:var(--ink); color:var(--paper); padding:1px 6px}
.turn.ban>div>span::before{content:"✕ "}
.turn.pick>div>span::before{content:"✚ "}
.turn-step{margin-left:auto; text-align:right; font-family:var(--mono); font-size:12px; font-weight:800; text-transform:uppercase}
.turn-step em{font-style:normal; font-weight:700; font-size:11px}
.turn .btn{margin-left:auto}
.turn-i{width:48px; height:48px; object-fit:cover; object-position:top; border:2px solid var(--ink)}
.maps{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
.mapc{position:relative; display:flex; flex-direction:column; align-items:center; gap:2px; padding:14px 8px 12px; border:2px solid var(--ink); border-radius:0; background:var(--paper); cursor:pointer; transition:transform .12s, box-shadow .12s}
.mapc[disabled]{cursor:default}
.mapc-art{height:96px; display:grid; place-items:center; margin-bottom:6px}
.mapc-i{width:92px; height:92px; object-fit:contain; transition:transform .2s}
.mapc-n{font-family:var(--disp); font-size:19px; text-transform:uppercase}
.mapc-c{font-family:var(--mono); font-size:10.5px}
.mapc:not([disabled]):hover{transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--ink)}
.maps.act-ban .mapc:not([disabled]):hover::before{content:"✕ БАН"; position:absolute; top:6px; right:6px; background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; font-weight:800; padding:2px 6px}
.maps.act-pick .mapc:not([disabled]):hover::before{content:"✚ ПІК"; position:absolute; top:6px; right:6px; background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; font-weight:800; padding:2px 6px}
.mapc:not([disabled]):hover .mapc-i{transform:scale(1.07) rotate(-3deg)}
.mapc.ban{border-style:dashed}
.mapc.ban::before{content:""; position:absolute; inset:0; background:var(--fade); z-index:1}
.mapc.ban .mapc-art{filter:grayscale(1) contrast(1.4)}
.mapc.ban::after{content:"BAN"; position:absolute; top:34px; left:50%; transform:translateX(-50%) rotate(-14deg); z-index:2; font-family:var(--disp); font-size:34px; line-height:1; letter-spacing:.05em; color:var(--ink); background:var(--paper); border:4px solid var(--ink); padding:2px 12px 0}
.mapc.ban .tag{position:relative; z-index:2}
.mapc.pick{border-width:4px; box-shadow:7px 7px 0 var(--ink)}
.mapc.pick.t{border-style:double; border-width:6px}
.mapc.pick.dec{border-style:dashed}
.mapc .tag{margin-top:6px; font-family:var(--mono); font-size:10.5px; font-weight:800; padding:2px 8px; border:2px solid var(--ink); background:var(--paper); text-transform:uppercase}
.mapc.pick .tag{background:var(--ink); color:var(--paper)}
.mapc.idle{border-style:dotted}
.mapc.idle .mapc-art{filter:grayscale(1)}
.mapc.roll{transform:scale(1.05) rotate(-1deg); box-shadow:0 0 0 4px var(--paper),0 0 0 8px var(--ink)}
.vfoot{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:16px; padding-top:12px; border-top:3px solid var(--ink)}
.vsave{font-family:var(--mono); font-size:12px; font-weight:700}

/* ---------- case ---------- */
.case-fab{position:fixed; right:calc(22px + env(safe-area-inset-right,0px)); bottom:calc(22px + env(safe-area-inset-bottom,0px)); z-index:30; width:84px; height:84px; border-radius:50%; border:3px solid var(--ink); background:var(--paper); color:var(--ink); cursor:pointer; display:grid; place-items:center; padding:14px; box-shadow:5px 5px 0 var(--ink)}
.case-fab::before,.case-fab::after{content:""; position:absolute; inset:-3px; border-radius:50%; border:3px solid var(--ink); animation:ring 2s ease-out infinite; pointer-events:none}
.case-fab::after{animation-delay:1s}
@keyframes ring{0%{transform:scale(1); opacity:1}100%{transform:scale(1.55); opacity:0}}
.case-fab svg{width:100%; height:auto; transition:transform .2s; position:relative}
.case-fab:hover svg{transform:scale(1.1) rotate(-6deg)}
.case-fab .tagline{position:absolute; top:-14px; left:50%; transform:translateX(-50%) rotate(-6deg); background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:10px; font-weight:800; letter-spacing:.1em; padding:2px 6px; white-space:nowrap}
.case-hero{display:flex; flex-wrap:wrap; align-items:center; gap:18px 30px; margin-bottom:20px}
.case-big{width:min(230px,60vw); color:var(--ink); transform:rotate(-4deg)}
.case-big svg{width:100%; height:auto; display:block}
.case-info{flex:1; min-width:240px}
.case-info p{margin:0 0 14px; font-family:var(--mono); font-size:12.5px}
.btn.case-go{font-size:16px; padding:12px 26px}
.case-count{margin-top:12px !important}
.case-h{margin:0 0 10px; font-family:var(--disp); font-weight:400; font-size:22px; text-transform:uppercase}
.case-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(118px,1fr)); gap:8px}
.ci{--r:#4B69FF; flex:none; width:156px; height:156px; position:relative; background:var(--paper); border:2px solid var(--ink); border-bottom:8px solid var(--r);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:8px; text-align:center}
.ci.t-blue{--r:#4B69FF} .ci.t-purple{--r:#8847FF} .ci.t-pink{--r:#D32CE6} .ci.t-red{--r:#EB4B4B} .ci.t-gold{--r:#E4AE39}
.ci-e{font-size:54px; line-height:1}
.ci.t-gold .ci-e{font-family:var(--disp); color:var(--r)}
.ci-n{font-size:12px; font-weight:800; line-height:1.2; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
.ci.small{width:auto; height:auto; min-height:104px; gap:6px}
.ci.small .ci-e{font-size:30px}
.ci.small .ci-n{font-size:11px}
.case-res{min-height:120px; display:flex; flex-direction:column; align-items:center; gap:16px; margin-top:20px}
.drop{--r:#4B69FF; display:flex; align-items:center; gap:18px; padding:14px 22px; border:3px solid var(--ink); border-bottom:10px solid var(--r); background:var(--paper); box-shadow:8px 8px 0 var(--ink); animation:pop .45s ease-out; max-width:100%}
.drop.t-blue{--r:#4B69FF} .drop.t-purple{--r:#8847FF} .drop.t-pink{--r:#D32CE6} .drop.t-red{--r:#EB4B4B} .drop.t-gold{--r:#E4AE39}
.drop-e{font-size:64px; line-height:1}
.drop small{display:inline-block; font-family:var(--mono); font-weight:800; font-size:11px; letter-spacing:.08em; text-transform:uppercase; background:var(--r); color:#fff; padding:1px 6px}
.drop strong{display:block; font-family:var(--disp); font-weight:400; font-size:24px; line-height:1.1; margin-top:4px}
.drop-act{display:flex; flex-wrap:wrap; justify-content:center; gap:8px}
.btn.gold-btn{background:#E4AE39; border-color:var(--ink); color:#000; text-decoration:none; box-shadow:5px 5px 0 var(--ink); animation:nudge 1s ease-in-out infinite}

@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .roster{position:static; padding:0 16px 12px}
  .roster-list{flex-direction:row; overflow-x:auto; padding:2px 6px 8px 2px; -webkit-overflow-scrolling:touch}
  .pl{width:auto; flex:none; min-width:150px}
  .layout .sizer{margin:0 16px}
  .roster-hint{margin-top:6px}
}
@media (max-width:760px){
  dialog.vdlg{width:100vw; max-width:100vw; height:100dvh; max-height:100dvh; margin:0; box-shadow:none; border-width:0}
  .vwrap{padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px))}
  .maps{grid-template-columns:repeat(2,1fr)}
  .series{gap:6px}
  .slot{padding:12px 5px 8px}
  .slot-h{flex-direction:column; align-items:center; gap:2px}
  .slot-m{height:62px} .slot-i{width:58px; height:58px} .slot-q{width:50px; height:50px; font-size:22px}
  .slot-n{font-size:15px}
  .vhead h2{font-size:22px}
}
@media (max-width:640px){
  .hero{padding:18px 16px 8px}
  .hero-grid{grid-template-columns:1fr}
  .mascot{position:absolute; right:-6px; top:46px; width:120px; margin:0; z-index:0}
  .mascot::after{display:none}
  .logo{width:calc(100% - 100px)}
  .bar{padding:0 16px 12px}
  .sizer{margin:0 16px}
  .summary{padding:8px 16px 24px}
  .foot{padding:6px 16px 120px}
  .case-fab{width:68px; height:68px; padding:11px}
  .drop{flex-direction:column; text-align:center}
  .drop strong{font-size:19px}
  .champ{max-width:none}
}
@media (prefers-reduced-motion:reduce){
  .m.fresh,.slot-i,.roll-win,.drop{animation:none}
}

.hero::before,.hero::after{content:"";position:absolute;top:10px;width:22px;height:22px;border-top:3px solid var(--ink);pointer-events:none}
.hero::before{left:10px;border-left:3px solid var(--ink)}
.hero::after{right:10px;border-right:3px solid var(--ink)}
.stage{cursor:crosshair}

/* paper scraps under loose text so random bullet holes never cover it */
h1,.meta,.roster-h,.summary h2,.summary .sub{width:fit-content; background:var(--paper)}
.legend span,.hint,.roster-hint,.foot-mark,.sect,.rl,.roll-t{background:var(--paper)}
.hint{padding:0 4px}

/* ===== readability pass: calmer, larger, fewer patterns ===== */
body{background-image:none}
body::before{display:none}
.hero::before,.hero::after{display:none}
:root{ --t:linear-gradient(90deg,var(--ink) 0 4px,transparent 4px); }
.hero{padding:20px 28px 8px}
.hero-grid{display:flex; flex-wrap:wrap; align-items:center; gap:10px 30px}
.logo{width:clamp(210px,17vw,290px); margin:0; flex:none}
.hero-main{flex:1; min-width:260px}
h1{font-size:clamp(24px,2.3vw,34px); line-height:1}
h1::after{font-family:var(--ui); font-size:12px; font-weight:700; letter-spacing:.12em; margin-top:8px}
.meta{font-family:var(--ui); font-size:14px; margin-top:6px}
.meta b{padding:0 4px}
.champ{margin-top:0; box-shadow:6px 6px 0 var(--ink); padding:10px 18px 10px 10px; outline:2px solid var(--ink); outline-offset:3px}
.champ .cup{width:64px}
.champ strong{font-size:clamp(22px,2.4vw,32px)}
.bar{padding:6px 28px 14px; border-top:2px solid var(--ink); margin:12px 28px 0; padding-left:0; padding-right:0}
.legend,.hint,.mode{font-family:var(--ui); letter-spacing:.02em}
.legend{font-size:13px}
.legend i{width:18px; height:14px}
.hint{font-size:13.5px}
.zoom button,.zoom output{font-family:var(--ui); font-size:13px}
.btn{font-family:var(--ui); font-size:13.5px; letter-spacing:.03em}

/* bracket */
.edge{stroke-dasharray:none; stroke-width:1.5}
.edge.lit{stroke-width:3}
.canvas.has-sel .edge{stroke-dasharray:none; opacity:.3}
.sect{font-size:32px; transform:none}
.sect::after{height:4px}
.sect.lb::after{background:none; border-bottom:4px dashed var(--ink); height:0}
.rl{font-family:var(--ui); font-size:12px; font-weight:800; letter-spacing:.08em}
.rl::before{content:""}
.m{width:232px}
.mh,.m.lb .mh{background:var(--paper); color:var(--ink); border-bottom:2px solid var(--ink); font-family:var(--ui); font-size:12px; font-weight:800; letter-spacing:.03em; padding:0 8px 0 10px}
.m.lb .mh>span,.m.lb .mh>span:first-child{background:none; color:var(--ink); padding:0; outline:0}
.mh .st{font-size:10.5px; font-weight:600; letter-spacing:.04em}
.mh .mi{padding:0}
.row{font-size:15px; font-weight:600; padding-left:10px}
.row+.row{border-top:1px solid var(--ink)}
.row .sc{font-family:var(--ui); font-weight:800; font-size:16px; border-left:2px solid var(--ink)}
.row.win{background:var(--paper); color:var(--ink)}
.row.win .nm{font-weight:900}
.row.win .nm::before{content:none}
.row.win .sc{background:var(--ink); color:var(--paper); border-left-color:var(--ink)}
.row.lose .nm{font-weight:500}
.row.tbd .nm{font-family:var(--ui); font-style:normal; font-weight:500; font-size:12.5px; text-decoration:none}
.row.hl .nm{text-decoration:underline; text-decoration-thickness:2px}
.row.mine{box-shadow:inset 6px 0 0 var(--ink)}
.row.mine .nm{text-decoration:none; font-weight:900}
.row.mine .nm::after{content:none}
.row.win.mine{box-shadow:inset 6px 0 0 var(--ink)}
.canvas.has-sel .m:not(.sel){opacity:.3}
.canvas.has-sel .m:not(.sel)::after{content:none}
.m.gf{border-width:5px}
.dog{position:absolute; pointer-events:none}
.dog-img{--src:var(--img-dog); width:100%; height:100%; transform:rotate(-4deg)}
.dog-tag{position:absolute; right:24px; bottom:18px; background:var(--ink); color:var(--paper); font-family:var(--ui); font-weight:800; font-size:13px; letter-spacing:.14em; padding:4px 10px; transform:rotate(-4deg)}
.hole{position:absolute; color:var(--ink); pointer-events:none}
.hole svg{display:block; overflow:visible}

/* roster + summary */
.roster-h,.summary h2{font-size:26px}
.pl{padding:7px 10px 8px 16px}
.pl.k-lb::before{width:4px; background:var(--ink)}
.pl-n{font-size:15.5px}
.pl-s{font-family:var(--ui); font-size:12px; font-weight:600; text-transform:none; letter-spacing:0}
.pl-pts{font-family:var(--ui); font-weight:900; font-size:22px}
.pl-pts small{font-family:var(--ui); font-size:10px}
.roster-hint,.summary .sub{font-family:var(--ui); font-size:13px}
.tbl th{font-family:var(--ui); font-size:12px}
.tbl td.pts,.tbl td.rank{font-family:var(--ui); font-weight:900; font-size:17px}
.tbl .st{font-family:var(--ui); font-size:12.5px; font-weight:600; text-transform:none}
.tbl-wrap,.toast{box-shadow:6px 6px 0 var(--ink)}

/* dialogs & veto: no hatching */
dialog::backdrop{background:rgba(255,255,255,.9)}

.saving{background:rgba(255,255,255,.85)}

.dlg .sub,.note,.field span,.lbl,.score-names{font-family:var(--ui)}
.score input,.score span{font-family:var(--ui); font-weight:900}
.btn:disabled{background:var(--paper); border-style:dashed}
.vblock{background:var(--paper)}
.rl-win{background:var(--paper)}
.rc.t span{background:var(--paper)}
.mapc.ban::before{content:none}
.mapc.ban .mapc-art,.mapc.ban .mapc-n,.mapc.ban .mapc-c{opacity:.3}
.slot.t::before{background:var(--paper); border:2px dashed var(--ink)}
.turn.t::before{background:var(--paper); border-right:3px dashed var(--ink)}
.vsteps li,.slot-h,.slot-by,.turn>div>span,.turn-step,.mapc-n{font-family:var(--ui)}
.mapc-n{font-weight:900; font-size:17px}
.slot-n{font-family:var(--ui); font-weight:900}
.vsteps li.dec b{background:var(--paper); outline:2px dashed var(--ink); outline-offset:-2px}

@media (max-width:640px){
  .hero{padding:16px 16px 6px}
  .logo{width:180px}
  .bar{margin:10px 16px 0}
}

/* mascot next to the logo */
.brand{display:flex; align-items:center; gap:4px; flex:none}
.hdog{--src:var(--img-dog); height:clamp(96px,8.5vw,132px); aspect-ratio:560/535; flex:none; transform:rotate(-4deg)}
@media (max-width:640px){ .hdog{height:76px} .brand .logo{width:160px} }

/* ===================== reference layout (white page, black header) ===================== */
:root{ --paper:#FFFFFF; --ink:#000000; color-scheme:light;
  --disp:"Oswald","Arial Narrow","Roboto Condensed",Impact,sans-serif; }
html{background:#fff; color:#000} body{background:transparent; color:#000}
#main{position:relative; overflow-x:clip}

/* header band */
.hero{position:relative; z-index:1; background:#000; color:#fff; padding:0; max-width:none}
.hero-grid{display:flex; flex-wrap:wrap; align-items:center; gap:12px 36px; min-height:132px; padding:16px clamp(220px,19vw,380px) 16px 28px}
.brand{display:flex; align-items:flex-start; gap:8px}
.brand::after{content:"↗"; font:700 22px/1 var(--disp); color:#fff; margin-top:4px}
.hero .logo{background:#fff; width:clamp(200px,15vw,270px)}
.hero-main{flex:1; min-width:240px}
.hero h1{background:transparent; color:#fff; width:auto; font-family:var(--disp); font-weight:700; font-size:clamp(26px,2.3vw,38px); line-height:1; letter-spacing:.01em; text-transform:uppercase}
.hero h1::after{content:"Double elimination ✕ Bo3 ✕ AK-47 / AWP / Deagle"; font-family:var(--disp); font-weight:500; font-size:14px; letter-spacing:.08em; margin-top:8px; color:#fff}
.hero .meta{background:transparent; color:#fff; width:auto; font-size:13.5px; margin-top:8px}
.hero .meta b{background:#fff; color:#000}
.slogan{display:flex; align-items:center; gap:14px; color:#fff}
.slogan::before{content:"↙"; font:700 22px/1 var(--disp); align-self:flex-end; margin-right:-4px}
.sl-emb{width:58px; height:58px; flex:none}
.sl-txt{display:flex; flex-direction:column; align-items:flex-start; font-family:var(--disp); text-transform:uppercase; line-height:.95}
.sl-txt b{font-weight:700; font-size:clamp(22px,1.9vw,32px); letter-spacing:.01em}
.sl-year{font-size:13px; font-weight:600; letter-spacing:.3em; display:flex; align-items:center; gap:8px; margin-bottom:4px}
.sl-year i{width:8px; height:8px; background:#fff; transform:rotate(45deg)}
.sl-box{margin-top:6px; border:2px solid #fff; padding:2px 10px 1px; font-size:13px; font-weight:600; letter-spacing:.22em}
.dog-st{position:absolute; z-index:2; top:14px; right:clamp(-40px,-1.5vw,-10px); width:clamp(220px,19vw,370px); height:auto; transform:rotate(7deg); pointer-events:none; filter:drop-shadow(6px 8px 0 rgba(0,0,0,1))}
.champ-row:empty{display:none}
.champ-row{position:relative; z-index:3; padding:16px 28px 0}
.champ-row .champ{margin:0; box-shadow:none; outline:0; background:#000; color:#fff; max-width:620px}

/* toolbar */
.bar{position:relative; z-index:4; margin:14px 28px 0; padding:0 clamp(200px,18vw,360px) 14px 0; border-top:0; border-bottom:3px solid #000}
.legend{display:none}
.hint{background:transparent; font-size:14px}
.btn,.zoom button,.zoom output{font-family:var(--disp); font-weight:600; font-size:14px; letter-spacing:.04em}
.layout{position:relative; z-index:3; margin-top:18px}

/* case button: inline in the toolbar on desktop */
@media (min-width:821px){
  .case-fab{position:relative; inset:auto; width:auto; height:40px; border-radius:0; border:2px solid #000; padding:3px 14px 3px 6px; display:inline-flex; align-items:center; gap:8px; box-shadow:4px 4px 0 #000; background:#fff}
  .case-fab::before,.case-fab::after{border-radius:0; inset:-2px; border-width:2px; animation-name:ringSq}
  .case-fab svg{width:34px; height:auto}
  .case-fab .tagline{position:static; transform:none; background:none; color:#000; font:600 14px/1 var(--disp); letter-spacing:.06em; padding:0}
  .case-fab .tagline::after{content:" — відкрити"}
}

@keyframes ringSq{0%{transform:scale(1); opacity:.9}100%{transform:scale(1.12,1.5); opacity:0}}
/* bracket: reference-style two-tone cards */
.sect{display:none}
.rl{background:transparent; font-family:var(--disp); font-weight:600; font-size:15px; letter-spacing:.03em; text-transform:uppercase; color:#000}
.rl.gf{font-size:30px; font-weight:700; transform:none; top:auto}
.edge{stroke:#000; stroke-width:2}
.edge.lit{stroke-width:3.5}
.m,.m.gf{border:0; background:transparent; overflow:visible; box-shadow:none}
.m .mh,.m.lb .mh{height:22px; background:transparent; border:0; padding:0 2px; color:#000; font-family:var(--disp); font-weight:600; font-size:12.5px; letter-spacing:.06em; text-transform:uppercase}
.m .mh .st{font-family:var(--ui); font-size:10.5px; font-weight:700; letter-spacing:.04em}
.m .mh .mi{background:transparent}
.m .row{height:35px; font-family:var(--disp); font-size:17px; font-weight:500; padding-left:12px; letter-spacing:.01em}
.m .mh+.row{background:#fff; color:#000; box-shadow:inset 0 0 0 2px #000}
.m .row+.row{background:#000; color:#fff; border-top:0}
.m .row .sc{width:46px; font-family:var(--disp); font-weight:700; font-size:21px; border-left:2px solid currentColor}
.m .row.win .nm{font-weight:700}
.m .mh+.row.win{background:#fff; color:#000}
.m .row+.row.win{background:#000; color:#fff}
.m .mh+.row.win .sc{background:#000; color:#fff; border-left-color:#000}
.m .row+.row.win .sc{background:#fff; color:#000; border-left-color:#fff}
.m .row.lose .nm{font-weight:400}
.m .row.tbd .nm{font-family:var(--ui); font-size:12.5px; font-weight:500}
.m .mh+.row.mine{box-shadow:inset 0 0 0 2px #000, inset 7px 0 0 #000}
.m .row+.row.mine{box-shadow:inset 7px 0 0 #fff}
.m.gf{outline:3px solid #000; outline-offset:5px}
.m.gf .mh{font-size:14px}
.m.gf .row{height:33px; font-size:19px}
.m.edit:hover{filter:drop-shadow(5px 5px 0 #000)}
.m.edit:hover .mh{text-decoration:underline}
.canvas.has-sel .m.sel{box-shadow:none}

/* roster: same two-tone language */
.roster-h{font-family:var(--disp); font-weight:700; font-size:22px; text-transform:uppercase; background:transparent}
.pl{padding:0; grid-template-columns:minmax(0,1fr) 54px; border:2px solid #000; background:#fff; overflow:hidden; row-gap:0}
.pl::before{display:none}
.pl-n{padding:6px 10px 0; font-family:var(--disp); font-weight:600; font-size:17px}
.pl-s{padding:0 10px 6px}
.pl-pts{grid-row:1/3; align-self:stretch; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#000; color:#fff; font-family:var(--disp); font-weight:700; font-size:22px}
.pl-pts small{color:#fff; font-size:9px}
.pl.k-out{border-style:dashed}
.pl[aria-pressed="true"]{background:#000; color:#fff}
.pl[aria-pressed="true"] .pl-pts{background:#fff; color:#000}
.pl[aria-pressed="true"] .pl-pts small{color:#000}
.pl:hover{box-shadow:4px 4px 0 #000}

/* summary + headings */
.summary h2,.case-h,.dlg h2,.vhead h2,.gate h2{font-family:var(--disp); font-weight:700}
.tbl th{background:#000; color:#fff; font-family:var(--disp); font-weight:600; font-size:13px}
.tbl td.pts,.tbl td.rank{font-family:var(--disp); font-weight:700; font-size:19px}

/* veto: recognisable CT / T emblems with side labels */
.rc{justify-content:space-between; padding-top:14px}
.rc-i{width:92px; height:92px; object-fit:contain; margin:0 auto}
.rc::before{font-family:var(--disp); font-size:15px; font-weight:700; padding:1px 8px; top:6px; left:6px}
.rc.ct::before{content:"CT"; background:#000; color:#fff}
.rc.t::before{content:"T"; background:#fff; color:#000; border:2px solid #000}
.rc span{font-family:var(--disp); font-size:17px; font-weight:600}
.vs-i{width:30px; height:30px; object-fit:contain}
.vs-p::after{font:700 12px/1 var(--disp); padding:3px 6px; margin-left:2px}
.vs-p.ct::after{content:"CT"; background:#000; color:#fff}
.vs-p.t::after{content:"T"; border:2px solid #000}
.turn-i{width:50px; height:50px; object-fit:contain; border:0}
.turn>div>strong::after{font:700 13px/1 var(--disp); padding:3px 7px; margin-left:10px; vertical-align:4px}
.turn.ct>div>strong::after{content:"CT"; background:#000; color:#fff}
.turn.t>div>strong::after{content:"T"; border:2px solid #000}
.roll-wi{width:72px; height:72px; object-fit:contain; border:0}
.slot.ct .slot-by::before{content:"CT · "; font-weight:800}
.slot.t .slot-by::before{content:"T · "; font-weight:800}
.mapc.pick:hover{background:var(--paper)}
dialog::backdrop{background:rgba(255,255,255,.88)}

@media (max-width:820px){
  .hero-grid{padding:14px 120px 14px 16px; min-height:0}
  .slogan{display:none}
  .dog-st{width:150px; top:8px; right:-18px}
  .bar{margin:12px 16px 0; padding-right:0}
  .champ-row{padding:12px 16px 0}
}

  -webkit-mask:var(--img-dog2) center/contain no-repeat; mask:var(--img-dog2) center/contain no-repeat}
.dog-st{display:none}
.hero-grid{padding:16px 28px}
.bar{padding-right:0}

/* pencil marks */
.m .row{position:relative}
.pencil{position:absolute; left:0; top:0; overflow:visible; pointer-events:none; z-index:2}
.m .row.elim .nm{text-decoration:none}

/* hover: no duplicated text, just a hard shadow behind the card */
.m.edit:hover{filter:none}
.m.edit:hover .mh{text-decoration:underline}
.m.edit::after{content:""; position:absolute; left:5px; right:-5px; top:27px; bottom:-5px; background:#000; z-index:-1; opacity:0; transition:opacity .12s}
.m.edit:hover::after,.m.edit:focus-visible::after{opacity:1}
.canvas.has-sel .m.edit:not(.sel)::after{content:""}
/* finish the white score cell inside the black row */
.m .row+.row.win .sc{box-shadow:inset 0 0 0 2px #000}
.m .row+.row .sc{border-left-color:#fff}
.m .row+.row.win .sc{border-left-color:#000}
/* labels sit on white so lines and the dog never touch the text */
.m .mh>span{background:#fff; padding:0 4px}
.m .mh>span:first-child{margin-left:-4px}
.rl{width:auto; background:#fff; padding:0 4px; margin-left:-4px}
.rl.gf{display:flex; align-items:center; gap:8px; background:#fff; padding:2px 6px; margin-left:-6px}
.rl.gf::before{width:30px; height:30px; margin:0; vertical-align:0}

/* divider between the brackets */
.divider{position:absolute; left:0; height:0; border-top:4px solid #000}
.divider span{position:absolute; left:0; font-family:var(--disp); font-weight:700; font-size:15px; letter-spacing:.06em; text-transform:uppercase; padding:3px 10px; white-space:nowrap}
.dv-up{bottom:2px; background:#000; color:#fff}
.dv-down{top:2px; background:#fff; color:#000; border:2px solid #000; border-top:0}

/* participants: one horizontal strip under the toolbar */
.layout{display:block; margin-top:14px}
.roster{position:static; display:flex; align-items:center; gap:14px; padding:0 28px 18px}
.roster-h{margin:0; font-size:18px; flex:none; writing-mode:vertical-rl; transform:rotate(180deg); background:#000; color:#fff; padding:8px 4px; letter-spacing:.08em}
.roster-list{flex:1; flex-direction:row; flex-wrap:nowrap; overflow-x:auto; gap:8px; padding:2px 6px 6px 2px}
.pl{flex:1 1 0; min-width:150px; width:auto}
.pl-n{font-size:16px}
.roster-hint{display:none}
.pl-s{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.layout .sizer{margin:0 28px}
@media (max-width:820px){
  .roster{padding:0 16px 12px}
  .roster-h{display:none}
  .pl{flex:0 0 auto; min-width:150px}
  .layout .sizer{margin:0 16px}
}

/* ===================== round 4: logo-only header, dog nudged right ===================== */
.hero-grid{justify-content:center; padding:18px 28px; min-height:0; gap:0}
.brand::after{content:none}
.hero .logo{width:clamp(220px,18vw,320px)}
.hero-main{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; flex:none; min-width:0}
.slogan{display:none}
.dog-bg{-webkit-mask-position:64% center; mask-position:64% center}
.rl.gf{background:transparent}
.foot-mark .skull-big{--src:var(--img-dog2); width:40px; aspect-ratio:900/937}

/* ===================== round 5: score cells always follow their row colour ===================== */
.m .mh+.row .sc,.m .mh+.row.win .sc{background:transparent; color:#000; border-left-color:#000; box-shadow:none}
.m .row+.row .sc,.m .row+.row.win .sc{background:transparent; color:#fff; border-left-color:#fff; box-shadow:none}
.m .row.win .sc{font-weight:700}
.m .row.lose .sc{font-weight:400}

/* ===================== round 6: no header band, just the logo ===================== */
.hero{background:transparent; color:#000}
.hero .logo{background:#000}
.hero-grid{padding:20px 28px 6px}

/* ===================== round 7: no background dog, small dog loader ===================== */
.dog-bg{display:none}
.loader{position:fixed; inset:0; z-index:100; display:grid; place-items:center; background:#fff; transition:opacity .4s ease, visibility .4s}
.loader.done{opacity:0; visibility:hidden}
.loader-dog{width:84px; aspect-ratio:900/937; background:#000; -webkit-mask:var(--img-dog2) center/contain no-repeat; mask:var(--img-dog2) center/contain no-repeat; animation:dogBob 1.1s ease-in-out infinite}
@keyframes dogBob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
@media (prefers-reduced-motion:reduce){ .loader-dog{animation:none} }

/* ===================== round 8: blue-grey page, dog back (lower), only player cells white ===================== */
:root{ --page:#9DAEBE; --dog:#8C9DAE; }
html{background:var(--page)}
.loader{background:var(--page)}
.dog-bg{display:block; z-index:-1; opacity:1; background:var(--dog);
  -webkit-mask:var(--img-dog2) no-repeat; mask:var(--img-dog2) no-repeat;
  -webkit-mask-size:auto 80vh; mask-size:auto 80vh;
  -webkit-mask-position:64% calc(100% - 2vh); mask-position:64% calc(100% - 2vh)}
/* everything except player cells sits directly on the page colour */
.m .mh>span,.rl,.rl.gf,.divider .dv-down,.hint,.meta,.roster-hint,.summary h2,.summary .sub,.foot-mark{background:transparent}
.btn,.zoom,.zoom output,.case-fab,.vx{background:transparent}
.btn.primary{background:#000; color:#fff}
.btn:hover,.zoom button:hover{background:#000; color:#fff}
@media (max-width:820px){ .case-fab{background:#fff} }
</style>

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function clone(o){return JSON.parse(JSON.stringify(o));}
function normalize(s){
  var d=clone(DEFAULT_STATE);
  if(s && typeof s==='object'){
    if(typeof s.title==='string') d.title=s.title;
    if(Array.isArray(s.players) && s.players.length===10) d.players=s.players.map(String);
    if(s.results && typeof s.results==='object') d.results=s.results;
    if(s.vetos && typeof s.vetos==='object') d.vetos=s.vetos;
    if(s.updatedAt) d.updatedAt=s.updatedAt;
  }
  return d;
}
function compute(st){
  var R={}, P={};
  function src(s){
    if(s.p!=null) return s.p;
    var r=R[s.w||s.l]; if(!r) return null;
    var ids=[r.pa,r.pb];
    return s.w ? ids[r.w] : ids[1-r.w];
  }
  MATCHES.forEach(function(m){
    var pa=src(m.a), pb=src(m.b);
    P[m.id]=[pa,pb];
    var r=st.results[m.id];
    if(r && pa!=null && pb!=null && r.pa===pa && r.pb===pb && (r.w===0||r.w===1)) R[m.id]=r;
  });
  return {R:R,P:P};
}
function prune(st){
  var c=compute(st), v={};
  st.results=c.R;
  Object.keys(st.vetos||{}).forEach(function(k){ var x=st.vetos[k], pp=c.P[k]; if(x&&pp&&x.pa===pp[0]&&x.pb===pp[1]) v[k]=x; });
  st.vetos=v;
  return st;
}
function placeholder(s){
  if(s.w) return 'Переможець '+BYID[s.w].code;

/* ---------- roster ---------- */
function playerInfo(R,i){
  var w=0,l=0,status='Верхня сітка',kind='ub',pf=0,pa=0;
  MATCHES.forEach(function(m){
    var r=R[m.id]; if(!r) return;
    var ids=[r.pa,r.pb], side=ids.indexOf(i); if(side<0) return;
    if(r.s){ pf+=r.s[side]||0; pa+=r.s[1-side]||0; }
    if(r.w===side) w++; else{
      l++;
      if(m.sect==='ub'){ status='Нижня сітка'; kind='lb'; }
      else if(m.id==='GF'){ status='2 місце'; kind='out'; }
      else if(m.id==='LBF'){ status='3 місце'; kind='out'; }
      else { status='Вибув'; kind='out'; }
    }
    if(m.id==='GF' && r.w===side){ status='Чемпіон'; kind='champ'; }
  });
  return {w:w,l:l,status:status,kind:kind,pf:pf,pa:pa};
}
function renderRoster(R){
  var pl=state.players, order=pl.map(function(_,i){return i;});

      '<span class="pl-n">'+(inf.kind==='champ'?'<i class="ic trophy"></i>':inf.kind==='out'?'<i class="ic skull"></i>':'')+'<span>'+esc(pl[i])+'</span></span>'+

  });

function renderSummary(R){
  var pl=state.players, rows=pl.map(function(n,i){ var inf=playerInfo(R,i); inf.i=i; inf.n=n; return inf; });
  rows.sort(function(a,b){ return (b.pf-a.pf)||((b.pf-b.pa)-(a.pf-a.pa))||(b.w-a.w)||(a.l-b.l)||(a.i-b.i); });
  var h='<table class="tbl"><thead><tr><th>#</th><th>Гравець</th><th>Матчі</th><th>Перемоги–поразки</th><th>Набрано</th><th>Пропущено</th><th>Різниця</th><th>Статус</th></tr></thead><tbody>';
  rows.forEach(function(r,k){
    var d=r.pf-r.pa;
    h+='<tr data-p="'+r.i+'"'+(selP===String(r.i)?' class="on"':'')+'><td class="rank">'+(k+1)+'</td><td>'+(r.kind==='champ'?'<i class="ic trophy"></i>':r.kind==='out'?'<i class="ic skull"></i>':'')+esc(r.n)+'</td><td>'+(r.w+r.l)+'</td><td>'+r.w+'–'+r.l+'</td><td class="pts">'+r.pf+'</td><td>'+r.pa+'</td><td'+(d<0?' class="neg"':'')+'>'+(d>0?'+':d<0?'−':'')+Math.abs(d)+'</td><td class="st">'+esc(r.status)+'</td></tr>';
  });
  $('sum').innerHTML=h+'</tbody></table>';
}

function seeded(str){
  var h=1779033703^str.length;
  for(var i=0;i<str.length;i++){ h=Math.imul(h^str.charCodeAt(i),3432918353); h=h<<13|h>>>19; }
  return function(){ h=Math.imul(h^h>>>16,2246822507); h=Math.imul(h^h>>>13,3266489909); h^=h>>>16; return (h>>>0)/4294967296; };
}
function smoothPath(pts){
  var d='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  for(var i=0;i<pts.length-1;i++){
    var p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    d+='C'+(p1[0]+(p2[0]-p0[0])/6).toFixed(1)+' '+(p1[1]+(p2[1]-p0[1])/6).toFixed(1)+' '+(p2[0]-(p3[0]-p1[0])/6).toFixed(1)+' '+(p2[1]-(p3[1]-p1[1])/6).toFixed(1)+' '+p2[0].toFixed(1)+' '+p2[1].toFixed(1);
  }
  return d;
}
function circlePath(rnd,cx,cy,rx,ry){
  var a0=-Math.PI*(0.55+rnd()*0.3), turn=Math.PI*2*(1.08+rnd()*0.14), n=26, pts=[], tilt=(rnd()-.5)*0.12, ph=rnd()*6;
  for(var i=0;i<=n;i++){
    var t=a0+turn*i/n, k=1+0.05*Math.sin(t*2+ph)+(rnd()-.5)*0.035+(i/n)*0.07;
    var x=Math.cos(t)*rx*k, y=Math.sin(t)*ry*k;
    pts.push([cx+x*Math.cos(tilt)-y*Math.sin(tilt), cy+x*Math.sin(tilt)+y*Math.cos(tilt)]);
  }
  return smoothPath(pts);
}
function strikePath(rnd,x0,x1,y){
  var n=5, pts=[], slope=(rnd()-.5)*6;
  for(var i=0;i<=n;i++){ var f=i/n; pts.push([x0+(x1-x0)*f+(rnd()-.5)*3, y+slope*(f-.5)+(rnd()-.5)*3.2]); }
  return smoothPath(pts);
}
function pencilMarks(cv){
  var rows=cv.querySelectorAll('.m .row.win,.m .row.lose');
  for(var i=0;i<rows.length;i++){
    var row=rows[i], nm=row.querySelector('.nm'), box=row.closest('.m'); if(!nm||!box) continue;
    var dark=!!row.previousElementSibling && row.previousElementSibling.classList.contains('row');
    var col=dark?'#6E9BFF':'#1E46C8';
    var rnd=seeded(box.getAttribute('data-id')+':'+(dark?1:0)+':'+row.className);
    var w=Math.min(nm.scrollWidth,nm.offsetWidth), x=nm.offsetLeft, h=row.offsetHeight||35, cy=h/2;
    var svg=document.createElementNS(NS,'svg');
    svg.setAttribute('class','pencil'); svg.setAttribute('width',row.offsetWidth||232); svg.setAttribute('height',h); svg.setAttribute('aria-hidden','true');
    var d1,d2,sw;
    if(row.classList.contains('win')){
      var rx=w/2+11, ry=h/2-1.5, cx=Math.min(x+w/2, 186-rx+4);
      d1=circlePath(rnd,cx,cy,rx,ry); d2=circlePath(rnd,cx+0.8,cy+0.6,rx-1.5,ry-1); sw=2.5;
    } else {
      d1=strikePath(rnd,x-5,x+w+6,cy+1); d2=strikePath(rnd,x-3,x+w+3,cy+2); sw=2.6;
    }
    [[d1,sw,.95],[d2,1.3,.55]].forEach(function(o){
      var pth=document.createElementNS(NS,'path');
      pth.setAttribute('d',o[0]); pth.setAttribute('fill','none'); pth.setAttribute('stroke',col);
      pth.setAttribute('stroke-width',o[1]); pth.setAttribute('stroke-linecap','round'); pth.setAttribute('stroke-linejoin','round');
      pth.setAttribute('opacity',o[2]); pth.setAttribute('filter','url(#pencil)');
      svg.appendChild(pth);
    });
    row.appendChild(svg);
  }
}

function syncPicks(){
  $('pk0').setAttribute('aria-pressed',String(sel===0));
  $('pk1').setAttribute('aria-pressed',String(sel===1));
  var note=$('dm-note');
  if(sel==null){ note.hidden=true; return; }
  var before=compute(state).R, trial=clone(state);
  trial.results[cur.m.id]={pa:cur.pp[0],pb:cur.pp[1],w:sel,s:null};
  var after=prune(trial).results, lost=0;
  Object.keys(before).forEach(function(k){ if(k!==cur.m.id && !after[k]) lost++; });
  if(lost){ note.textContent='Зміна переможця скине '+lost+' '+plural(lost,'пізніший результат','пізніші результати','пізніших результатів')+', бо в тих матчах змінюються учасники.'; note.hidden=false; }
  else note.hidden=true;
}
function plural(n,a,b,c){ var m10=n%10,m100=n%100; if(m10===1&&m100!==11) return a; if(m10>=2&&m10<=4&&(m100<12||m100>14)) return b; return c; }
function readScore(el){ var v=el.value.trim(); if(v==='') return null; var n=parseInt(v,10); return isFinite(n)&&n>=0&&n<=99?n:NaN; }

function autoPick(){ var a=readScore($('s0')), b=readScore($('s1')); if(a!=null&&b!=null&&!isNaN(a)&&!isNaN(b)&&a!==b){ sel=a>b?0:1; syncPicks(); } }

$('dm-cancel').onclick=function(){ $('dm').close(); };
$('dm-save').onclick=function(){
  var err=$('dm-err'), a=readScore($('s0')), b=readScore($('s1'));
  function fail(t){ err.textContent=t; err.hidden=false; }
  if(sel==null) return fail('Оберіть переможця.');
  if(isNaN(a)||isNaN(b)) return fail('Рахунок має бути числом від 0 до 99.');
  if((a==null)!==(b==null)) return fail('Вкажіть рахунок для обох гравців або залиште обидва поля порожніми.');
  if(a!=null){
    if(a===b) return fail('Рахунок не може бути нічийним.');
    if((sel===0&&a<b)||(sel===1&&b<a)) return fail('Рахунок не збігається з обраним переможцем.');
  }
  var next=clone(state);
  next.results[cur.m.id]={pa:cur.pp[0],pb:cur.pp[1],w:sel,s:a==null?null:[a,b]};
  prune(next);
  save(next,cur.m.id);

/* ---------- GitHub storage ---------- */
function gh(path,opts){
  opts=opts||{};
  var h={'Accept':'application/vnd.github+json'};
  if(opts.token){ h['Authorization']='Bearer '+opts.token; }
  if(opts.body){ h['Content-Type']='application/json'; }
  return fetch(API+path,{method:opts.method||'GET',headers:h,body:opts.body?JSON.stringify(opts.body):undefined,cache:opts.token?'no-store':'default'});
}
function fileBody(st){ var f={}; f[FILE]={content:JSON.stringify(st,null,1)}; return f; }

function readGist(g){
  ownerLogin=g.owner&&g.owner.login||ownerLogin;
  var f=g.files&&g.files[FILE];
  if(!f) return Promise.reject({kind:'nf'});
  if(f.truncated && f.raw_url) return fetch(f.raw_url).then(function(r){return r.text();});
  return Promise.resolve(f.content);
}
function load(){
  if(!gistId) return Promise.resolve();
  return gh('/gists/'+gistId,{token:editable?token:null}).then(function(r){
    if(r.status===404) throw {kind:'nf'};
    if(r.status===403||r.status===429) throw {kind:'rl'};
    if(!r.ok) throw {kind:'net'};
    return r.json();
  }).then(readGist).then(function(text){
    var s=normalize(JSON.parse(text));
    if(busy) return;
    if(!state || JSON.stringify(s)!==JSON.stringify(state)){
      state=s; render();
      if(!editable && vCur && $('dv').open && !vAnim){ var nv=vetoOf(vCur.id); if(nv){ vCur.v=clone(nv); renderVeto(); } }
    }
  }).catch(function(e){
    var k=e&&e.kind;
    if(state){ if(k==='rl') toast('GitHub тимчасово обмежив оновлення. Сітка оновиться трохи пізніше.'); return; }
    if(k==='nf') showGate('<h2>Сітку не знайдено</h2><p>Перевірте посилання: можливо, воно скопійоване не повністю.</p>');
    else if(k==='rl') showGate('<h2>Забагато запитів</h2><p>GitHub тимчасово обмежив кількість переглядів з вашої мережі. Оновіть сторінку за кілька хвилин.</p>');
    else showGate('<h2>Не вдалося завантажити сітку</h2><p>Перевірте інтернет-з’єднання та оновіть сторінку.</p>');
  });
}
function checkOwner(tok){
  return gh('/user',{token:tok}).then(function(r){
    if(r.status===401) throw {kind:'bad'};
    if(!r.ok) throw {kind:'net'};
    return r.json();
  }).then(function(u){
    if(ownerLogin && u.login!==ownerLogin) throw {kind:'other',login:u.login};
    return u.login;
  });
}
function save(next,changedId){
  if(busy||!editable) return;
  busy=true;
  next.updatedAt=Date.now();
  if($('dm').open) $('dm').close();
  if($('dp').open) $('dp').close();
  $('saving').hidden=false;
  gh('/gists/'+gistId,{method:'PATCH',token:token,body:{files:fileBody(next)}}).then(function(r){
    busy=false; $('saving').hidden=true;
    if(r.ok){ state=next; fresh=changedId; render(); toast('Збережено. Друзі побачать зміни протягом пари хвилин.'); return; }
    if(r.status===401||r.status===403||r.status===404){ toast('GitHub не прийняв токен. Увійдіть як організатор ще раз.'); logout(); return; }
    toast('Не вдалося зберегти. Спробуйте ще раз.');
  },function(){
    busy=false; $('saving').hidden=true;
    toast('Не вдалося зберегти. Перевірте з’єднання і спробуйте ще раз.');
  });
}

var MAPBY={}; MAPS.forEach(function(m){MAPBY[m.id]=m;});
var SLOTS=[{t:'Карта 1',w:'AK-47'},{t:'Карта 2',w:'AWP'},{t:'Карта 3, десайдер',w:'Desert Eagle'}];
var SIDE=['ct','t'];
var reduceMotion=false; try{ reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}

function rnd(n){ try{ var a=new Uint32Array(1); crypto.getRandomValues(a); return a[0]%n; }catch(e){ return Math.floor(Math.random()*n); } }
function seqFor(v){
  var F=v.first,S=1-F;
  // fmt 2: A ban, B ban, A pick (map 1), B pick (map 2), B ban, A ban, decider
  if(v.fmt===2) return [{p:F,a:'ban'},{p:S,a:'ban'},{p:F,a:'pick',slot:0},{p:S,a:'pick',slot:1},{p:S,a:'ban'},{p:F,a:'ban'}];
  return [{p:F,a:'ban'},{p:F,a:'ban'},{p:F,a:'pick',slot:0},{p:S,a:'ban'},{p:S,a:'ban'},{p:S,a:'pick',slot:1}];
}
function vetoValid(v,pp){ return !!(v && pp && v.pa===pp[0] && v.pb===pp[1] && (v.first===0||v.first===1)); }
function vetoOf(id){ var v=state.vetos&&state.vetos[id]; return vetoValid(v,compute(state).P[id])?v:null; }
function vetoStage(v){ if(!v||v.first==null) return 'roll'; if((v.steps||[]).length<6) return 'veto'; if(!v.decider) return 'decider'; return 'done'; }
function mapStatus(v){
  var st={}; if(!v||v.first==null) return st;
  var seq=seqFor(v);
  (v.steps||[]).forEach(function(s,i){ var q=seq[i]; if(q) st[s.m]={kind:q.a,by:q.p,slot:q.slot}; });
  if(v.decider) st[v.decider]={kind:'pick',slot:2,dec:true};
  return st;
}
function vetoMaps(v){
  var out=[null,null,null], st=mapStatus(v);
  Object.keys(st).forEach(function(k){ if(st[k].kind==='pick') out[st[k].slot]=k; });
  return out;
}
function remainingMaps(v){ var st=mapStatus(v); return MAPS.filter(function(m){return !st[m.id];}).map(function(m){return m.id;}); }
function iconImg(id,cls,alt){ return '<img class="'+(cls||'')+(id==='ct'||id==='t'?' ink':'')+'" src="'+ICON[id]+'" alt="'+esc(alt||'')+'" draggable="false">'; }

/* silent save used by the veto: keeps dialogs open */
function saveSilent(next){
  next.updatedAt=Date.now();
  return gh('/gists/'+gistId,{method:'PATCH',token:token,body:{files:fileBody(next)}}).then(function(r){
    if(r.ok){ state=next; render(); return true; }
    if(r.status===401||r.status===403||r.status===404){ toast('GitHub не прийняв токен. Увійдіть як організатор ще раз.'); logout(); }
    return false;
  },function(){ return false; });
}
function withVeto(id,v){ var next=clone(state); if(!next.vetos) next.vetos={}; if(v) next.vetos[id]=v; else delete next.vetos[id]; return next; }

/* ---------- veto dialog ---------- */
var vCur=null, vSaving=false, vAnim=false;
function openVeto(id,start){
  var pp=compute(state).P[id];
  if(pp[0]==null||pp[1]==null){ toast('Учасники цього матчу ще не визначені.'); return; }
  var v=vetoOf(id);
  vCur={id:id,pp:pp,v:v?clone(v):null};
  if(!$('dv').open) $('dv').showModal();
  if(!vCur.v){ if(start&&editable) spinRoulette(); else { $('dv').close(); toast('Карти для цього матчу ще не обрано.'); } return; }
  renderVeto();
  if(editable && vetoStage(vCur.v)==='decider') runDecider();
}
$('dv-close').onclick=function(){ $('dv').close(); };
$('dv').addEventListener('close',function(){ vAnim=false; if(cur && $('dm').open) renderMatchVeto(); });

function names(){ return [state.players[vCur.pp[0]],state.players[vCur.pp[1]]]; }
function headVeto(){
  var n=names();
  $('dv-h').textContent='Вибір карт, '+BYID[vCur.id].code;
  $('dv-sub').innerHTML='<span class="vs-p ct">'+iconImg('ct','vs-i','CT')+esc(n[0])+'</span><span class="vs-x">проти</span><span class="vs-p t">'+iconImg('t','vs-i','T')+esc(n[1])+'</span><span class="vs-bo">Bo3</span>';
}

function spinRoulette(){
  headVeto();
  var n=names(), winner=rnd(2), N=46, stop=38, cards='';
  for(var i=0;i<N;i++){
    var who=i===stop?winner:rnd(2);
    cards+='<div class="rc '+SIDE[who]+'"'+(i===stop?' id="rc-win"':'')+'>'+iconImg(SIDE[who],'rc-i',SIDE[who].toUpperCase())+'<span>'+esc(n[who])+'</span></div>';
  }
  $('dv-body').innerHTML='<div class="roll"><p class="roll-t">Хто першим банить і обирає карту?</p>'+
    '<div class="rl-win" id="rl-win"><div class="rl-strip" id="rl-strip">'+cards+'</div><div class="rl-mark" aria-hidden="true"></div></div>'+
    '<div class="roll-res" id="roll-res" aria-live="polite"></div></div>';
  var nv={pa:vCur.pp[0],pb:vCur.pp[1],first:winner,steps:[],decider:null,fmt:2,at:Date.now()};
  var saved=saveSilent(withVeto(vCur.id,nv));
  var strip=$('rl-strip'), win=$('rl-win');
  var STEP=166, CARD=156;
  var jitter=rnd(Math.floor(CARD*0.7))-Math.floor(CARD*0.35);
  var target=-(stop*STEP+CARD/2-win.clientWidth/2+jitter);
  var dur=reduceMotion?600:5600;
  vAnim=true;
  strip.style.transform='translateX(0px)';
  void strip.offsetWidth;
  strip.style.transition='transform '+dur+'ms cubic-bezier(.08,.6,.12,1)';
  strip.style.transform='translateX('+target+'px)';
  var done=false;
  function finish(){
    if(done) return; done=true; vAnim=false;
    var wc=$('rc-win'); if(wc) wc.classList.add('won');
    saved.then(function(ok){
      var res=$('roll-res'); if(!res) return;
      if(ok){
        vCur.v=nv;
        res.innerHTML='<div class="roll-win '+SIDE[winner]+'">'+iconImg(SIDE[winner],'roll-wi',SIDE[winner].toUpperCase())+'<div><small>Першим обирає</small><strong>'+esc(n[winner])+'</strong></div></div>'+
          '<button type="button" class="btn primary" id="roll-go">Перейти до банів</button>';
        $('roll-go').onclick=function(){ renderVeto(); };
      } else {
        res.innerHTML='<p class="err">Не вдалося зберегти результат рулетки.</p><button type="button" class="btn primary" id="roll-retry">Спробувати зберегти ще раз</button>';
        $('roll-retry').onclick=function(){ $('roll-retry').disabled=true; saved=saveSilent(withVeto(vCur.id,nv)); done=false; finish(); };
      }
    });
  }
  strip.addEventListener('transitionend',finish,{once:true});
  setTimeout(finish,dur+400);
}

function renderVeto(){
  if(!vCur||!vCur.v) return;
  headVeto();
  var v=vCur.v, n=names(), stage=vetoStage(v), st=mapStatus(v), maps=vetoMaps(v), seq=seqFor(v), k=(v.steps||[]).length;
  // series
  var h='<div class="series">';
  SLOTS.forEach(function(s,i){
    var id=maps[i], by=i<2?(i===0?v.first:1-v.first):null;
    h+='<div class="slot'+(id?' filled':'')+(i===2?' dec':' '+SIDE[by])+'">'+
      '<div class="slot-h"><span>'+s.t+'</span><b>'+s.w+'</b></div>'+
      '<div class="slot-m">'+(id?iconImg(id,'slot-i',MAPBY[id].name):'<span class="slot-q">?</span>')+'</div>'+
      '<div class="slot-n">'+(id?esc(MAPBY[id].name):'Ще не обрано')+'</div>'+
      '<div class="slot-by">'+(i===2?'Випадковий вибір':'Обирає '+esc(n[by]))+'</div></div>';
  });
  h+='</div>';
  // 7-step timeline
  h+='<ol class="vsteps">';
  seq.forEach(function(q,i){
    var state_=i<k?' done':(i===k&&stage==='veto'?' now':'');
    var mapTxt=i<k?MAPBY[v.steps[i].m].name:'';
    h+='<li class="'+SIDE[q.p]+' '+q.a+state_+'"><b>'+(i+1)+'</b>'+iconImg(SIDE[q.p],'vst-i','')+'<span>'+(q.a==='ban'?'Бан ':'Пік ')+esc(n[q.p])+(mapTxt?': '+esc(mapTxt):'')+'</span></li>';
  });
  h+='<li class="dec'+(v.decider?' done':(stage==='decider'?' now':''))+'"><b>7</b><span>Десайдер'+(v.decider?': '+esc(MAPBY[v.decider].name):'')+'</span></li></ol>';
  // turn banner
  var turn='', act=null;
  if(stage==='veto'){
    var q=seq[k]; act=q.a;
    var banNo=seq.slice(0,k).filter(function(x){return x.p===q.p&&x.a==='ban';}).length+1;
    turn='<div class="turn '+SIDE[q.p]+' '+q.a+'">'+iconImg(SIDE[q.p],'turn-i',SIDE[q.p].toUpperCase())+'<div><strong>'+esc(n[q.p])+'</strong><span>'+
      (q.a==='ban'?'банить карту ('+banNo+'-й бан)':'обирає '+(q.slot===0?'карту 1 серії (AK-47)':'карту 2 серії (AWP)'))+'</span></div>'+
      '<span class="turn-step">Крок '+(k+1)+' з 7'+(editable?'':'<br><em>Голосування проводить організатор</em>')+'</span></div>';
  } else if(stage==='decider'){
    turn='<div class="turn dec"><div><strong>Десайдер</strong><span>Третя карта (Desert Eagle) обирається випадково з тих, що залишились.</span></div>'+
      (editable?'<button type="button" class="btn primary" id="dec-go">Обрати десайдер</button>':'')+'</div>';
  } else {
    turn='<div class="turn fin"><div><strong>Карти обрано</strong><span>'+maps.map(function(id,i){return esc(MAPBY[id].name)+' ('+SLOTS[i].w+')';}).join(', ')+'</span></div></div>';
  }
  // map grid
  var g='<div class="maps'+(act?' act-'+act:'')+'" id="maps">';
  MAPS.forEach(function(m){
    var s=st[m.id], cls='mapc', tag='';
    if(s){
      if(s.kind==='ban'){ cls+=' ban'; tag='<span class="tag">Бан: '+esc(n[s.by])+'</span>'; }
      else { cls+=' pick '+(s.dec?'dec':SIDE[s.by]); tag='<span class="tag">'+(s.slot===2?'Десайдер':'Карта '+(s.slot+1))+', '+SLOTS[s.slot].w+'</span>'; }
    }
    if(!s && stage==='done') cls+=' idle';
    var can=editable&&stage==='veto'&&!s;
    g+='<button type="button" class="'+cls+'" data-map="'+m.id+'"'+(can?'':' disabled')+(can?' aria-label="'+esc((act==='ban'?'Забанити ':'Обрати ')+m.name)+'"':'')+'>'+
      '<span class="mapc-art">'+iconImg(m.id,'mapc-i','')+'</span><span class="mapc-n">'+esc(m.name)+'</span><span class="mapc-c">'+m.code+'</span>'+tag+'</button>';
  });
  g+='</div>';
  var foot='<div class="vfoot">'+
    (editable&&((v.steps||[]).length||v.decider)?'<button type="button" class="btn ghost" id="v-undo">Скасувати останній крок</button>':'')+
    '<span class="spacer"></span><span class="vsave" id="vsave"></span>'+
    '<button type="button" class="btn'+(stage==='done'?' primary':'')+'" id="v-close2">'+(stage==='done'?'Готово':'Закрити')+'</button></div>';
  $('dv-body').innerHTML=h+turn+g+foot;
  $('v-close2').onclick=function(){ $('dv').close(); };
  if($('v-undo')) $('v-undo').onclick=undoStep;
  if($('dec-go')) $('dec-go').onclick=runDecider;
  $('maps').onclick=function(e){ var b=e.target.closest('.mapc:not([disabled])'); if(b) doStep(b.getAttribute('data-map')); };
}

function commitVeto(nv,prev){
  vSaving=true; vCur.v=nv; renderVeto(); if($('vsave')) $('vsave').textContent='Зберігаю…';
  return saveSilent(withVeto(vCur.id,nv)).then(function(ok){
    vSaving=false;
    if(!ok){ vCur.v=prev; toast('Не вдалося зберегти крок. Спробуйте ще раз.'); }
    if($('dv').open && !vAnim) renderVeto();
    return ok;
  });
}
function doStep(mapId){
  if(!editable||vSaving||vAnim) return;
  var v=vCur.v; if(vetoStage(v)!=='veto'||mapStatus(v)[mapId]) return;
  var nv=clone(v); nv.steps.push({m:mapId});
  commitVeto(nv,v).then(function(ok){ if(ok && vetoStage(nv)==='decider') runDecider(); });
}
function undoStep(){
  if(!editable||vSaving||vAnim) return;
  var v=vCur.v, nv=clone(v);
  if(nv.decider) nv.decider=null; else if(nv.steps.length) nv.steps.pop(); else return;
  commitVeto(nv,v);
}
function runDecider(){
  if(!editable||vSaving||vAnim) return;
  var v=vCur.v; if(vetoStage(v)!=='decider') return;
  var rem=remainingMaps(v); if(!rem.length) return;
  var chosen=rem[rnd(rem.length)], nv=clone(v); nv.decider=chosen;
  vAnim=true; vSaving=true;
  if($('dec-go')) $('dec-go').disabled=true;
  var saved=saveSilent(withVeto(vCur.id,nv));
  var cards=rem.map(function(id){ return document.querySelector('.mapc[data-map="'+id+'"]'); });
  var i=0, delay=70;
  // the last highlighted card must be the chosen map
  var ticks=reduceMotion?1:(function(){ var t=16; while(t%rem.length!==(rem.indexOf(chosen)+1)%rem.length) t++; return t; })();
  function tick(){
    cards.forEach(function(c){ if(c) c.classList.remove('roll'); });
    var c=cards[i%rem.length]; if(c) c.classList.add('roll');
    i++;
    if(i<ticks){ delay=Math.min(520,delay*1.17); setTimeout(tick,delay); }
    else setTimeout(end,650);
  }
  function end(){
    saved.then(function(ok){
      vAnim=false; vSaving=false;
      if(ok){ vCur.v=nv; }
      else toast('Не вдалося зберегти десайдер. Натисніть «Обрати десайдер» ще раз.');
      if($('dv').open) renderVeto();
    });
  }
  tick();
}

/* veto block inside the organizer's match dialog */
function renderMatchVeto(){
  if(!cur) return;
  var id=cur.m.id, v=vetoOf(id), played=!!compute(state).R[id], b=$('dm-veto');

  var h='<span class="lbl">Карти, Bo3</span>';

  } else {
    var maps=vetoMaps(v), stage=vetoStage(v);

      return '<div class="vb-m">'+(id?iconImg(id,'vb-i',MAPBY[id].name):'<span class="vb-q">?</span>')+'<span>'+(id?esc(MAPBY[id].name):'—')+'</span><small>'+s.w+'</small></div>'; }).join('')+'</div>'+
      '<div class="vb-act"><button type="button" class="btn'+(stage==='done'?'':' primary')+'" id="vb-open">'+(stage==='done'?'Переглянути вибір':'Продовжити голосування')+'</button>'+
      '<button type="button" class="btn ghost" id="vb-reset">Почати заново</button></div>';
  }

    btn.disabled=true;
    saveSilent(withVeto(id,null)).then(function(ok){ if(!ok) toast('Не вдалося скинути вибір карт.'); renderMatchVeto(); });
  };
}


/* ---------- decorations: a few bullet holes in empty parts of the bracket ---------- */
var HOLES_HTML='', _unusedHoles=(function(){
  function R(a,b){ return a+Math.random()*(b-a); }
  function hole(sz){
    var c=sz/2, r=sz*R(.13,.17), n=20+Math.floor(R(0,10)), pts=[], i, s;
    for(i=0;i<n;i++){ var a=i/n*Math.PI*2+R(-.12,.12), rr=r*(i%2?R(.75,1):R(1.2,1.9)); pts.push((c+Math.cos(a)*rr).toFixed(1)+','+(c+Math.sin(a)*rr).toFixed(1)); }
    s='<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 '+sz+' '+sz+'"><polygon points="'+pts.join(' ')+'" fill="currentColor"/>';
    for(i=0;i<3;i++){ var a2=R(0,Math.PI*2), l=r*R(1.8,2.8); s+='<path d="M'+c+' '+c+'L'+(c+Math.cos(a2)*l).toFixed(1)+' '+(c+Math.sin(a2)*l).toFixed(1)+'" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>'; }
    for(i=0;i<8;i++){ var a3=R(0,Math.PI*2), d=r*R(1.7,3); s+='<circle cx="'+(c+Math.cos(a3)*d).toFixed(1)+'" cy="'+(c+Math.sin(a3)*d).toFixed(1)+'" r="'+R(.8,2.2).toFixed(1)+'" fill="currentColor"/>'; }
    return s+'</svg>';
  }
  // zones in canvas coordinates that never hold matches or lines
  var zones=[[20,210,210,380],[20,880,210,1100],[1100,1050,1800,1110]], h='';
  zones.forEach(function(z){ var sz=Math.round(R(64,100)); h+='<div class="hole" style="left:'+Math.round(R(z[0],z[2]-sz))+'px;top:'+Math.round(R(z[1],z[3]-sz))+'px;transform:rotate('+Math.round(R(0,360))+'deg)">'+hole(sz)+'</div>'; });
  return h;
})();

];

};
var TIERBY={}; TIERS.forEach(function(t){TIERBY[t.k]=t;});
var ODDS_TOTAL=TIERS.reduce(function(a,t){return a+t.odds;},0);
function drawItem(){
  var r=rnd(ODDS_TOTAL), acc=0, tier=TIERS[TIERS.length-1];
  for(var i=0;i<TIERS.length;i++){ acc+=TIERS[i].odds; if(r<acc){ tier=TIERS[i]; break; } }
  var list=ITEMS[tier.k], it=list[rnd(list.length)];
  return {t:tier.k,e:it[0],n:it[1]};
}
var CASE_SVG='<svg viewBox="0 0 120 92" aria-hidden="true" fill="currentColor">'+
  '<rect x="43" y="3" width="34" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="6"/>'+
  '<rect x="4" y="14" width="112" height="75" rx="3"/>'+

  '<path d="M10 20h12v4H14v8h-4zM110 20H98v4h8v8h4zM10 83h12v-4H14v-8h-4zM110 83H98v-4h8v-8h4z" style="fill:var(--paper)"/>'+
  '<circle cx="60" cy="58" r="16" style="fill:var(--paper)"/><circle cx="60" cy="58" r="11.5"/>'+
  '<path d="M60 49.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z" style="fill:var(--paper)"/>'+
  '<path d="M18 70l6-3M100 26l5 4M88 78l7-2" stroke="var(--paper)" stroke-width="2" style="stroke:var(--paper)"/></svg>';

var caseCount=0; try{ caseCount=parseInt(localStorage.getItem('cs2-cases')||'0',10)||0; }catch(e){}
var caseSpinning=false;
function itemCard(it,hide,cls){
  var gold=it.t==='gold';
  return '<div class="ci t-'+it.t+(cls?' '+cls:'')+'"><span class="ci-e">'+(gold&&hide?'★':it.e)+'</span><span class="ci-n">'+esc(gold&&hide?'Рідкісний особливий предмет':it.n)+'</span></div>';
}
function caseHome(){
  var grid='';
  TIERS.slice().forEach(function(t){ ITEMS[t.k].forEach(function(it){ grid+=itemCard({t:t.k,e:it[0],n:it[1]},true,'small'); }); });
  $('dc-body').innerHTML='<div class="case-hero"><div class="case-big">'+CASE_SVG+'</div>'+
    '<div class="case-info"><p>У кейсі 60 предметів: від картоплі до надувної жінки. Шанси як у справжньому CS: золото випадає приблизно раз на 400 відкриттів.</p>'+
    '<button type="button" class="btn primary case-go" id="dc-go">Відкрити кейс</button><p class="case-count">Ви відкрили кейсів: '+caseCount+'</p></div></div>'+
    '<h3 class="case-h">Вміст кейсу</h3><div class="case-grid">'+grid+'</div>';
  $('dc-go').onclick=openCase;
}
function openCase(){
  if(caseSpinning) return;
  caseSpinning=true;
  var N=56, stop=48, win=drawItem(), cards='';
  for(var i=0;i<N;i++) cards+=itemCard(i===stop?win:drawItem(),true,i===stop?'win':'');
  $('dc-body').innerHTML='<div class="rl-win case-win" id="cs-win"><div class="rl-strip" id="cs-strip">'+cards+'</div><div class="rl-mark" aria-hidden="true"></div></div><div class="case-res" id="cs-res" aria-live="polite"></div>';
  var strip=$('cs-strip'), box=$('cs-win'), STEP=166, CARD=156;

  strip.style.transform='translateX('+target+'px)';
  var done=false;

    if(done) return; done=true; caseSpinning=false;

}
